<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>重力方块</title>
  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      overflow: hidden;
    }
    #frame {
      width: min(980px, calc(100vw - 16px));
      height: calc(100vh - 16px);
      max-height: calc(100vh - 16px);
      background: rgba(13, 17, 23, 0.65);
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 0 50px rgba(0,0,0,0.35);
      overflow: hidden;
    }
    #layout {
      display: flex;
      gap: 12px;
      align-items: stretch;
      height: 100%;
    }
    #gamePanel {
      flex: 1 1 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
    }
    #infoPanel {
      flex: 0 0 280px;
      min-width: 260px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.04);
      color: #e6edf3;
      overflow: auto;
    }
    #titleRow {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
    }
    #titleActions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #gameTitle {
      font-size: 16px;
      font-weight: 800;
      color: #e6edf3;
    }
    #modeLabel {
      font-size: 11px;
      color: #ffd93d;
      font-weight: 800;
      text-align: right;
    }
    .iconBtn {
      width: 34px;
      height: 34px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: rgba(230,237,243,0.92);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      transition: transform 0.2s, background 0.2s;
      user-select: none;
      -webkit-user-select: none;
    }
    .iconBtn:active { transform: scale(0.95); }
    .iconBtn:hover { background: rgba(255,255,255,0.08); }
    #statsGrid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .statBox {
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(13, 17, 23, 0.55);
      padding: 10px 10px;
    }
    .statLabel {
      font-size: 11px;
      color: rgba(230,237,243,0.6);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .statValue {
      font-size: 22px;
      font-weight: 900;
      color: #64ffda;
      line-height: 1;
    }
    .statValueWrap {
      position: relative;
      display: inline-block;
      min-width: 60px;
    }
    #score.bump {
      animation: scoreBump 0.18s ease;
    }
    @keyframes scoreBump {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    #scoreDelta {
      position: absolute;
      right: 0;
      top: -10px;
      font-size: 12px;
      font-weight: 900;
      color: #ffd93d;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.18s ease, transform 0.18s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #scoreDelta.show {
      opacity: 1;
      transform: translateY(0);
    }
    .smallBtn {
      flex: 1 1 auto;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 800;
      color: #0d1117;
      background: linear-gradient(90deg, #64ffda, #4fd1c5);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .smallBtn:active { transform: scale(0.97); }
    .ghostBtn {
      flex: 1 1 auto;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: 800;
      color: #e6edf3;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .ghostBtn:active { transform: scale(0.97); }
    .ghostBtn:hover { background: rgba(255,255,255,0.08); }
    #helpText {
      color: rgba(230,237,243,0.65);
      font-size: 12px;
      line-height: 1.5;
    }
    @media (max-width: 760px) {
      #layout { flex-direction: column; }
      #frame { height: auto; max-height: none; overflow: visible; }
      body { overflow: auto; }
      #infoPanel {
        min-width: 0;
        width: 100%;
        padding: 8px;
        gap: 8px;
      }
      #statsGrid { grid-template-columns: 1fr 1fr; }
      #infoTools {
        flex-wrap: wrap;
        gap: 6px;
      }
      .chipBtn {
        flex: 1 1 calc(50% - 6px);
        text-align: center;
      }
      #helpText {
        font-size: 11px;
      }
    }
    @media (max-width: 560px) {
      #frame {
        width: calc(100vw - 10px);
        padding: 8px;
        border-radius: 12px;
      }
      #gameContainer {
        width: 100%;
      }
      #overlay {
        padding: 12px 0 14px;
      }
      #overlay h1 {
        font-size: 24px;
        margin-bottom: 4px;
      }
      #overlay .subtitle {
        font-size: 11px;
        margin-bottom: 12px;
        line-height: 1.45;
      }
      .mode-section {
        padding: 0 12px;
        margin-bottom: 10px;
      }
      .mode-btns {
        width: 100%;
        flex-wrap: wrap;
        gap: 6px;
      }
      .mode-btn {
        flex: 1 1 calc(33.33% - 6px);
        min-width: 86px;
        min-height: 36px;
        padding: 8px 10px;
        font-size: 12px;
      }
      #overlay .btn {
        width: calc(100% - 24px);
        margin-left: 12px;
        margin-right: 12px;
        min-height: 44px;
      }
    }
    #gameContainer {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(100, 200, 255, 0.3);
    }
    #gameCanvas {
      display: block;
      background: #0d1117;
    }
    #overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      padding: 18px 0;
      z-index: 20;
      color: #fff;
    }
    #overlay * {
      touch-action: pan-y;
    }
    #overlay h1 {
      font-size: 26px;
      margin-bottom: 6px;
      background: linear-gradient(90deg, #64ffda, #ff6b6b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #overlay .subtitle {
      font-size: 12px;
      color: #8b949e;
      margin-bottom: 18px;
      text-align: center;
      padding: 0 20px;
      line-height: 1.6;
    }
    .mode-section {
      width: 100%;
      padding: 0 20px;
      margin-bottom: 14px;
    }
    .mode-section label {
      font-size: 12px;
      color: #8b949e;
      display: block;
      margin-bottom: 8px;
      text-align: center;
    }
    .mode-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .mode-btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: bold;
      color: #8b949e;
      background: rgba(100,255,218,0.08);
      border: 1px solid rgba(100,255,218,0.2);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      color: #0d1117;
      background: #64ffda;
      border-color: #64ffda;
    }
    .btn {
      margin-top: 8px;
      padding: 13px 40px;
      font-size: 15px;
      font-weight: bold;
      color: #0d1117;
      background: linear-gradient(90deg, #64ffda, #4fd1c5);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .btn:active { transform: scale(0.95); }
    #overlay .btn {
      margin-top: 12px;
    }
    #deadOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.38);
      z-index: 23;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    #deadCard {
      width: min(380px, calc(100% - 20px));
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      padding: 14px;
      color: #e6edf3;
      text-align: center;
    }
    #deadTitle {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 8px;
      color: #ff6b6b;
    }
    #deadReason {
      font-size: 12px;
      color: rgba(230,237,243,0.75);
      line-height: 1.5;
    }
    .deadRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    #pauseOverlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(13, 17, 23, 0.86);
      z-index: 22;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    #pauseCard {
      width: min(360px, calc(100% - 20px));
      border-radius: 16px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      padding: 14px;
      color: #e6edf3;
    }
    #pauseTitle {
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 10px;
      color: #e6edf3;
    }
    .pauseRow {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .pauseBtn {
      padding: 12px 12px;
      font-size: 14px;
      font-weight: 900;
      border-radius: 12px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: #e6edf3;
    }
    .pauseBtn.primary {
      background: linear-gradient(90deg, #64ffda, #4fd1c5);
      border: none;
      color: #0d1117;
    }
    #infoTools {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .chipBtn {
      padding: 8px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.06);
      color: rgba(230,237,243,0.92);
      font-weight: 900;
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    #panelRules, #panelScore {
      margin-top: 10px;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(13, 17, 23, 0.45);
      color: rgba(230,237,243,0.75);
      font-size: 12px;
      line-height: 1.55;
    }
    #finalScore {
      font-size: 40px;
      color: #64ffda;
      margin: 12px 0;
    }
    .hidden { display: none !important; }
    #hint {
      position: absolute;
      bottom: 7px;
      left: 0; right: 0;
      text-align: center;
      color: #4b5563;
      font-size: 10px;
      pointer-events: none;
    }
    #toast {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #fff;
      font-size: 12px;
      font-weight: bold;
      z-index: 30;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.2s ease;
      text-align: center;
      white-space: pre-line;
    }
    #toast.show {
      opacity: 1;
    }
    #itemBar {
      position: absolute;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
      z-index: 15;
      pointer-events: auto;
    }
    .item-slot {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.16);
      background: rgba(255, 255, 255, 0.06);
      color: #e6edf3;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 0.08s ease, background 0.12s ease;
    }
    .item-slot:active {
      transform: scale(0.95);
    }
    .item-slot.empty {
      color: rgba(230,237,243,0.28);
      border-color: rgba(255,255,255,0.10);
    }
    .item-slot .keycap {
      position: absolute;
      transform: translate(14px, -14px);
      width: 18px;
      height: 18px;
      border-radius: 6px;
      background: rgba(13, 17, 23, 0.9);
      border: 1px solid rgba(255,255,255,0.14);
      color: rgba(230,237,243,0.7);
      font-size: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="frame">
    <div id="layout">
      <div id="gamePanel">
        <div id="gameContainer">
          <canvas id="gameCanvas"></canvas>
          <div id="overlay">
            <h1>重力方块</h1>
            <p class="subtitle">方块从中央生成<br>倾斜手机 / 方向键控制<br>贴边可滑行，将要碰到才停下</p>

            <div class="mode-section">
              <label>模式</label>
              <div class="mode-btns" id="modeGroup">
                <button class="mode-btn active" data-mode="normal">普通</button>
                <button class="mode-btn" data-mode="items">道具</button>
              </div>
            </div>

            <div class="mode-section">
              <label>画布大小</label>
              <div class="mode-btns" id="sizeGroup">
                <button class="mode-btn" data-size="10">10×10</button>
                <button class="mode-btn active" data-size="15">15×15</button>
                <button class="mode-btn" data-size="20">20×20</button>
              </div>
            </div>

            <div class="mode-section">
              <label>难度</label>
              <div class="mode-btns" id="diffGroup">
                <button class="mode-btn active" data-diff="easy">简单</button>
                <button class="mode-btn" data-diff="normal">普通</button>
                <button class="mode-btn" data-diff="hard">困难</button>
              </div>
            </div>

            <div class="mode-section">
              <label>权限</label>
              <div class="mode-btns">
                <button class="mode-btn" id="sensorPermBtn">开启重力</button>
              </div>
              <p class="subtitle" id="sensorPermTip" style="margin-bottom:0;">iPhone 需要手动开启重力权限</p>
            </div>

            <button class="btn" id="startBtn">开始游戏</button>
          </div>
          <div id="pauseOverlay" class="hidden">
            <div id="pauseCard">
              <div id="pauseTitle">已暂停</div>
              <div class="pauseRow">
                <button class="pauseBtn primary" id="resumeBtn">继续</button>
                <button class="pauseBtn" id="pauseRestartBtn">重新开始</button>
              </div>
              <div class="pauseRow">
                <button class="pauseBtn" id="homeBtn">返回主页</button>
                <button class="pauseBtn" id="settingsBtn">设置</button>
              </div>
              <div class="pauseRow hidden" id="pauseSettingsRow">
                <button class="pauseBtn" id="pauseSoundBtn">声音</button>
                <button class="pauseBtn" id="pauseVibrateBtn">震动</button>
              </div>
            </div>
          </div>
          <div id="deadOverlay" class="hidden">
            <div id="deadCard">
              <div id="deadTitle">失败</div>
              <div id="deadReason"></div>
              <div class="deadRow">
                <button class="pauseBtn primary" id="deadViewResultBtn">查看结果</button>
                <button class="pauseBtn" id="deadRestartBtn">重新开始</button>
              </div>
              <div class="deadRow">
                <button class="pauseBtn" id="deadHomeBtn">返回主页</button>
                <button class="pauseBtn" id="deadCloseBtn">继续查看</button>
              </div>
            </div>
          </div>
          <div id="hint">📱 倾斜手机 / ⌨️ 方向键</div>
          <div id="toast"></div>
          <div id="itemBar" class="hidden"></div>
        </div>
      </div>

      <div id="infoPanel" class="hidden">
        <div id="titleRow">
          <div id="gameTitle">重力方块</div>
          <div id="titleActions">
            <div id="modeLabel"></div>
            <button class="iconBtn hidden" id="pauseBtn" title="暂停">⏸</button>
            <button class="iconBtn hidden" id="restartNowBtn" title="重新开始">↻</button>
          </div>
        </div>
        <div id="statsGrid">
          <div class="statBox">
            <div class="statLabel">分数</div>
            <div class="statValueWrap">
              <div class="statValue" id="score">0</div>
              <div id="scoreDelta"></div>
            </div>
          </div>
          <div class="statBox">
            <div class="statLabel">最高</div>
            <div class="statValue" id="best">0</div>
          </div>
          <div class="statBox">
            <div class="statLabel">消除</div>
            <div class="statValue" id="clears">0</div>
          </div>
          <div class="statBox">
            <div class="statLabel">充满</div>
            <div class="statValue" id="fill">0%</div>
          </div>
        </div>
        <div id="infoTools">
          <button class="chipBtn" id="ruleBtn">规则</button>
          <button class="chipBtn" id="scoreBtn">得分</button>
          <button class="chipBtn" id="soundBtn">声音关</button>
          <button class="chipBtn" id="vibrateBtn">震动关</button>
        </div>
        <div id="panelRules" class="hidden"></div>
        <div id="panelScore" class="hidden"></div>
        <div id="helpText">道具：消除带字母的格子获得<br>使用：点击道具槽或按 1-4</div>
      </div>
    </div>
  </div>

  <script>
    const COLORS = ['#ff6b6b', '#64ffda', '#ffd93d', '#6bcbff', '#c792ea', '#ff9f43'];
    const GAME_MODE = {
      normal: { label: '普通' },
      items: { label: '道具' },
    };

    // 角度 → 每格移动间隔(ms)：30度=500ms(2格/s)，15度=1000ms
    // interval = 15000 / |angle|
    const MIN_ANGLE = 2;
    const MAX_ANGLE = 75;
    const MAX_SPEED_CELLS_PER_SEC = 5;
    const TILT_DEADZONE = 2;
    const MOVE_CURVE_EXP = 1.6;
    const MOVE_SMOOTH_MS = 80;
    const SETTLE_DELAY_MS = 180;

    // 难度配置：speedMult 越大移动越快
    const DIFF_CONFIG = {
      easy:   { label: '简单', speedMult: 0.6, scoreMult: 0.9 },
      normal: { label: '普通', speedMult: 1.0, scoreMult: 1.0 },
      hard:   { label: '困难', speedMult: 2.0, scoreMult: 1.15 },
    };

    const SHAPE_DEFS = [
      { key: 'O',   weight: 16, shape: [[0,0],[1,0],[0,1],[1,1]] },

      { key: 'I3H', weight: 14, shape: [[0,0],[1,0],[2,0]] },
      { key: 'I3V', weight: 14, shape: [[0,0],[0,1],[0,2]] },

      { key: 'L0',  weight: 4,  shape: [[0,0],[0,1],[1,1]] },
      { key: 'L1',  weight: 4,  shape: [[0,0],[1,0],[0,1]] },
      { key: 'L2',  weight: 4,  shape: [[0,0],[1,0],[1,1]] },
      { key: 'L3',  weight: 4,  shape: [[1,0],[0,1],[1,1]] },

      { key: 'J0',  weight: 4,  shape: [[1,0],[1,1],[0,1]] },
      { key: 'J1',  weight: 4,  shape: [[0,0],[0,1],[1,0]] },
      { key: 'J2',  weight: 4,  shape: [[0,0],[1,0],[0,1]] },
      { key: 'J3',  weight: 4,  shape: [[0,0],[1,0],[1,1]] },

      { key: 'TU',  weight: 4,  shape: [[0,0],[1,0],[2,0],[1,1]] },
      { key: 'TR',  weight: 4,  shape: [[1,0],[0,1],[1,1],[1,2]] },
      { key: 'TD',  weight: 4,  shape: [[1,0],[0,1],[1,1],[2,1]] },
      { key: 'TL',  weight: 4,  shape: [[0,0],[0,1],[1,1],[0,2]] },

      { key: 'ZH',  weight: 4,  shape: [[0,0],[1,0],[1,1],[2,1]] },
      { key: 'ZV',  weight: 4,  shape: [[1,0],[0,1],[1,1],[0,2]] },
      { key: 'SH',  weight: 4,  shape: [[1,0],[2,0],[0,1],[1,1]] },
      { key: 'SV',  weight: 4,  shape: [[0,0],[0,1],[1,1],[1,2]] },

      { key: 'S1',  weight: 0,  shape: [[0,0]] },
    ];

    const ITEM_TYPES = {
      bomb:  { id: 1, icon: '💣', label: 'B' },
      fill:  { id: 2, icon: '🛠️', label: 'F' },

    function shouldSuppressErrorMessage(msg) {
      const s = String(msg || '').toLowerCase();
      if (!s) return true;
      if (s === 'script error.') return true;
      if (s.includes('resizeobserver')) return true;
      if (s.includes('passive event listener')) return true;
      if (s.includes('unable to preventdefault')) return true;
      if (s.includes('aborterror')) return true;
      if (s.includes('the operation was aborted')) return true;
      if (s.includes('networkerror')) return true;
      if (s.includes('load failed')) return true;
      return false;

        const msg = (e && e.message) ? String(e.message) : '发生错误';
        if (shouldSuppressErrorMessage(msg)) return;
        showToast(msg, '#ff6b6b', 1400);
      });
      window.addEventListener('unhandledrejection', e => {
        const msg = (e && e.reason) ? String(e.reason) : '发生错误';
        if (shouldSuppressErrorMessage(msg)) return;
        showToast(msg, '#ff6b6b', 1400);
      });
      canvas.addEventListener('click', e => {
        if (gameState === 'dead') {
          document.getElementById('deadOverlay').classList.remove('hidden');
          e.preventDefault();
          return;

        if (!pendingTarget) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / CELL);
        const y = Math.floor((e.clientY - rect.top) / CELL);
        usePendingItemAtCell(x, y);
        e.preventDefault();

      canvas.addEventListener('touchend', e => {
        if (gameState === 'dead') {
          document.getElementById('deadOverlay').classList.remove('hidden');
          e.preventDefault();
          return;
        }
        if (!pendingTarget) return;
        const t = e.changedTouches && e.changedTouches[0];
        if (!t) return;
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((t.clientX - rect.left) / CELL);
        const y = Math.floor((t.clientY - rect.top) / CELL);
        usePendingItemAtCell(x, y);

        const x = Math.floor((clientX - rect.left) / CELL);
        const y = Math.floor((clientY - rect.top) / CELL);
        const valid = x >= 0 && x < COLS && y >= 0 && y < ROWS && grid[y][x] === 0 && !isPickupCell(x, y) && !isInCenterZone(x, y);
        aimCell = { x, y, valid };
      };
      canvas.addEventListener('mousemove', e => updateAimFromClient(e.clientX, e.clientY));

        if (!pendingTarget) return;

    function initSensorPermissionState() {
      if (!window.DeviceOrientationEvent) {
        sensorPermissionState = 'unsupported';
        return;
      }
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        sensorPermissionState = 'needs_request';
        return;
      }
      sensorPermissionState = 'granted';
    }

    function attachOrientationListener() {
      if (orientationListenerAttached) return;
      if (!window.DeviceOrientationEvent) return;
      window.addEventListener('deviceorientation', onOrient);
      orientationListenerAttached = true;
    }

    async function requestSensorPermission() {
      if (!window.DeviceOrientationEvent) {
        sensorPermissionState = 'unsupported';
        updateSensorPermissionUI();
        showToast('当前设备不支持重力感应', '#8b949e', 900);
        return;
      }
      if (typeof DeviceOrientationEvent.requestPermission !== 'function') {
        sensorPermissionState = 'granted';
        attachOrientationListener();
        updateSensorPermissionUI();
        showToast('重力已开启', '#64ffda', 800);
        return;
      }
      const perm = await DeviceOrientationEvent.requestPermission().catch(() => 'denied');
      sensorPermissionState = perm === 'granted' ? 'granted' : 'denied';
      if (sensorPermissionState === 'granted') attachOrientationListener();
      updateSensorPermissionUI();
      showToast(sensorPermissionState === 'granted' ? '重力权限已开启' : '重力权限被拒绝', sensorPermissionState === 'granted' ? '#64ffda' : '#ff6b6b', 900);
    }

    function updateSensorPermissionUI(root = document) {
      const btn = root.querySelector('#sensorPermBtn');
      const tip = root.querySelector('#sensorPermTip');
      if (!btn) return;
      if (sensorPermissionState === 'unsupported') {
        btn.textContent = '不支持';
        btn.disabled = true;
        if (tip) tip.textContent = '当前设备不支持重力感应';
        return;
      }
      btn.disabled = false;
      if (sensorPermissionState === 'granted') {
        btn.textContent = '重力已开启';
        if (tip) tip.textContent = '已开启：倾斜手机控制';
        return;
      }
      if (sensorPermissionState === 'denied') {
        btn.textContent = '重新开启重力';
        if (tip) tip.textContent = '权限被拒绝，可再次尝试开启';
        return;
      }
      btn.textContent = '开启重力';
      if (tip) tip.textContent = 'iPhone 需要点击此按钮授权';
    }

    function vibrate(pattern) {
