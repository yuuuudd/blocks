    function ensureAudioContext() {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return null;
      if (!audioCtx) audioCtx = new Ctx();
      return audioCtx;
    }

    function ensureAudioRunning() {
      const ctx = ensureAudioContext();
      if (!ctx) return null;
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      return ctx;
    }

    function unlockAudioFromGesture() {
      if (!audioUnlocked) audioUnlocked = true;
      ensureBgmTracks();
      try { ensureAudioRunning(); } catch (_) {}
      if (!soundOn) return;
      if (!bgmPrimed) primeBgmTracks();
      syncAudioState();
    }

    function primeBgmTracks() {
      if (bgmPrimed) return;
      bgmPrimed = true;
      ensureBgmTracks();
      const tracks = [menuBgm, gameBgm, deathBgm];
      for (const t of tracks) {
        if (!t) continue;
        const wasPlaying = !t.paused;
        const prevMuted = t.muted;
        t.muted = true;
        const p = t.play();
        if (p && typeof p.then === 'function') {
          p.then(() => {
            if (!wasPlaying) {
              t.pause();
              try { t.currentTime = 0; } catch (_) {}
            }
            t.muted = prevMuted;
          }).catch(() => {
            t.muted = prevMuted;
          });
        } else {
          if (!wasPlaying) {
            t.pause();
            try { t.currentTime = 0; } catch (_) {}
          }
          t.muted = prevMuted;
        }
      }
    }

    function createNoiseBuffer(ctx, duration = 0.2) {
      const buffer = ctx.createBuffer(1, Math.max(1, Math.floor(ctx.sampleRate * duration)), ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      return buffer;
    }

    function scheduleEnvelope(gainNode, ctx, attack, hold, release, peak = 1.0) {
      const now = ctx.currentTime;
      gainNode.gain.cancelScheduledValues(now);
      gainNode.gain.setValueAtTime(0.0001, now);
      gainNode.gain.linearRampToValueAtTime(peak, now + attack);
      gainNode.gain.setValueAtTime(peak, now + attack + hold);
      gainNode.gain.exponentialRampToValueAtTime(0.0001, now + attack + hold + release);
    }

    function playTone({ type = 'sine', frequency = 440, toFrequency = null, duration = 0.12, gain = 0.05, attack = 0.004, hold = 0.02, release = 0.08, filterType = '', filterFrequency = 0, filterQ = 0.8 }) {
      if (!soundOn) return;
      const ctx = ensureAudioRunning();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gainNode = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, ctx.currentTime);
      if (toFrequency !== null) {
        osc.frequency.exponentialRampToValueAtTime(Math.max(1, toFrequency), ctx.currentTime + duration);
      }
      gainNode.gain.value = 0.0001;
      if (filterType) {
        const filter = ctx.createBiquadFilter();
        filter.type = filterType;
        filter.frequency.value = filterFrequency;
        filter.Q.value = filterQ;
        osc.connect(filter);
        filter.connect(gainNode);
      } else {
        osc.connect(gainNode);
      }
      gainNode.connect(ctx.destination);
      const actualGain = Math.min(0.22, gain * SFX_GAIN_MULT);
      scheduleEnvelope(gainNode, ctx, attack, hold, release, actualGain);
      osc.start();
      osc.stop(ctx.currentTime + duration + 0.02);
    }

    function playNoise({ duration = 0.14, gain = 0.05, attack = 0.004, hold = 0.02, release = 0.08, filterType = 'bandpass', filterFrequency = 1600, filterQ = 0.7, sweepTo = null }) {
      if (!soundOn) return;
      const ctx = ensureAudioRunning();
      if (!ctx) return;
      const source = ctx.createBufferSource();
      source.buffer = createNoiseBuffer(ctx, Math.max(duration, 0.1));
      const filter = ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.setValueAtTime(filterFrequency, ctx.currentTime);
      if (sweepTo !== null) {
        filter.frequency.exponentialRampToValueAtTime(Math.max(30, sweepTo), ctx.currentTime + duration);
      }
      filter.Q.value = filterQ;
      const gainNode = ctx.createGain();
      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(ctx.destination);
      const actualGain = Math.min(0.24, gain * SFX_GAIN_MULT);
      scheduleEnvelope(gainNode, ctx, attack, hold, release, actualGain);
      source.start();
      source.stop(ctx.currentTime + duration + 0.02);
    }

    function playSfx(kind) {
      if (!soundOn) return;
      const now = performance.now();
      const cooldown = SFX_COOLDOWN_MS[kind] || 0;
      if (cooldown > 0 && now - (lastSfxAt[kind] || 0) < cooldown) return;
      lastSfxAt[kind] = now;
      switch (kind) {
        case 'move':
          playTone({ type: 'square', frequency: 430, duration: 0.04, gain: 0.018, attack: 0.002, hold: 0.01, release: 0.026 });
          return;
        case 'land':
          playTone({ type: 'sine', frequency: 130, toFrequency: 76, duration: 0.18, gain: 0.11, attack: 0.002, hold: 0.02, release: 0.12 });
          return;
        case 'clear1':
          playTone({ type: 'sine', frequency: 880, duration: 0.2, gain: 0.075, attack: 0.003, hold: 0.018, release: 0.1 });
          return;
        case 'clear2':
          playTone({ type: 'sine', frequency: 660, toFrequency: 494, duration: 0.24, gain: 0.08, attack: 0.003, hold: 0.024, release: 0.11 });
          return;
        case 'clear3':
          playTone({ type: 'sawtooth', frequency: 42, duration: 0.54, gain: 0.085, attack: 0.004, hold: 0.045, release: 0.2 });
          playTone({ type: 'sine', frequency: 120, duration: 0.45, gain: 0.035, attack: 0.002, hold: 0.02, release: 0.14 });
          return;
        case 'clear4':
          playNoise({ duration: 0.85, gain: 0.085, attack: 0.004, hold: 0.045, release: 0.24, filterFrequency: 2400, filterQ: 0.7, sweepTo: 7200 });
          return;
        case 'itemCollect':
          playTone({ type: 'triangle', frequency: 740, toFrequency: 1040, duration: 0.13, gain: 0.065, attack: 0.003, hold: 0.014, release: 0.07 });
          return;
        case 'itemUse':
          playTone({ type: 'square', frequency: 360, duration: 0.09, gain: 0.072, attack: 0.002, hold: 0.012, release: 0.06 });
          return;
        case 'gameOver':
          playTone({ type: 'sine', frequency: 180, toFrequency: 60, duration: 0.9, gain: 0.1, attack: 0.004, hold: 0.02, release: 0.28 });
          playNoise({ duration: 0.6, gain: 0.04, attack: 0.004, hold: 0.02, release: 0.15, filterFrequency: 900, filterQ: 0.8, sweepTo: 180 });
          return;
        case 'start':
          playTone({ type: 'triangle', frequency: 392, toFrequency: 784, duration: 0.14, gain: 0.07, attack: 0.003, hold: 0.01, release: 0.06 });
          return;
        case 'pause':
          playTone({ type: 'sine', frequency: 520, toFrequency: 420, duration: 0.1, gain: 0.055, attack: 0.003, hold: 0.01, release: 0.05 });
          return;
        case 'resume':
          playTone({ type: 'sine', frequency: 420, toFrequency: 560, duration: 0.1, gain: 0.055, attack: 0.003, hold: 0.01, release: 0.05 });
          return;
        case 'home':
          playTone({ type: 'sine', frequency: 460, duration: 0.09, gain: 0.05, attack: 0.003, hold: 0.01, release: 0.05 });
          return;
        default:
          return;
      }
    }

    function createBgmTrack(paths) {
      const track = new Audio(paths[0]);
      track.loop = true;
      track.preload = 'auto';
      track.volume = BGM_VOLUME;
      track.playsInline = true;
      let idx = 0;
      const tryFallback = () => {
        if (idx >= paths.length - 1) return;
        const wasPlaying = !track.paused;
        idx += 1;
        track.src = paths[idx];
        track.load();
        if (wasPlaying && soundOn && audioUnlocked) {
          track.play().catch(() => {});
        }
      };
      track.addEventListener('error', tryFallback);
      return track;
    }

    function ensureBgmTracks() {
      if (!menuBgm) {
        menuBgm = createBgmTrack([
          'Assets/Audio/EnumBGM.mp3',
          'Assets/Audio/Enum.mp3',
          'Assets/EnumBGM.mp3',
          'Assets/Enum.mp3',
        ]);
      }
      if (!gameBgm) {
        gameBgm = createBgmTrack([
          'Assets/Audio/MainBGM.mp3',
          'Assets/Audio/Main.mp3',
          'Assets/MainBGM.mp3',
          'Assets/Main.mp3',
        ]);
      }
      if (!deathBgm) {
        deathBgm = createBgmTrack([
          'Assets/Audio/DeathBGM.mp3',
          'Assets/Audio/Death.mp3',
          'Assets/DeathBGM.mp3',
          'Assets/Death.mp3',
        ]);
      }
    }

    function getBgmTrack(kind) {
      if (kind === 'game') return gameBgm;
      if (kind === 'death') return deathBgm;
      return menuBgm;
    }

    function pauseBgm(track) {
      if (!track) return;
      track.pause();
      try { track.currentTime = 0; } catch (_) {}
    }

    function playBgm(kind) {
      ensureBgmTracks();
      const next = getBgmTrack(kind);
      const prev = activeBgm ? getBgmTrack(activeBgm) : null;
      if (prev && prev !== next) pauseBgm(prev);
      activeBgm = kind;
      if (!soundOn) return;
      if (!audioUnlocked) audioUnlocked = true;

      const retryMutedAutoplay = () => {
        const prevMuted = next.muted;
        next.muted = true;
        try { next.currentTime = 0; } catch (_) {}
        const mutedPlay = next.play();
        if (!mutedPlay || typeof mutedPlay.then !== 'function') {
          setTimeout(() => {
            next.muted = prevMuted;
            if (!next.paused) {
              next.volume = BGM_VOLUME;
              pendingBgmKind = '';
            }
          }, 140);
          return;
        }
        mutedPlay.then(() => {
          next.muted = prevMuted;
          next.volume = BGM_VOLUME;
          pendingBgmKind = '';
        }).catch(() => {
          next.muted = prevMuted;
        });
      };

      const tryPlay = () => {
        if (!next.paused) return;
        try { next.currentTime = 0; } catch (_) {}
        const p = next.play();
        if (!p || typeof p.catch !== 'function') {
          setTimeout(() => {
            if (next.paused) retryMutedAutoplay();
          }, 120);
          return;
        }
        p.catch(() => {
          pendingBgmKind = kind;
          next.addEventListener('canplaythrough', () => {
            if (!soundOn) return;
            if (pendingBgmKind && pendingBgmKind !== kind) return;
            const retryWhenReady = next.play();
            if (retryWhenReady && typeof retryWhenReady.catch === 'function') {
              retryWhenReady.then(() => { pendingBgmKind = ''; }).catch(() => {
                retryMutedAutoplay();
              });
            }
          }, { once: true });
          const retryPlay = () => {
            const retry = next.play();
            if (retry && typeof retry.catch === 'function') {
              retry.then(() => { pendingBgmKind = ''; }).catch(() => {
                retryMutedAutoplay();
              });
            }
          };
          const ctx = ensureAudioContext();
          if (!ctx || ctx.state === 'running') {
            retryPlay();
            return;
          }
          ctx.resume().then(() => {
            retryPlay();
          }).catch(() => {});
        });
      };

      try { ensureAudioRunning(); } catch (_) {}
      if (next.paused) {
        tryPlay();
      }
    }

    function stopBgm() {
      ensureBgmTracks();
      pauseBgm(menuBgm);
      pauseBgm(gameBgm);
      pauseBgm(deathBgm);
      activeBgm = '';
    }

    function syncAudioState() {
      if (!soundOn) {
        stopBgm();
        return;
      }
      if (gameState === 'playing') {
        playBgm('game');
        return;
      }
      if (gameState === 'dead') {
        playBgm('death');
        return;
      }
      playBgm('menu');
    }

    function weightedPick(list, getWeight) {
      let total = 0;
      for (const item of list) total += Math.max(0, getWeight(item));
      if (total <= 0) return list[0];
      let r = Math.random() * total;
      for (const item of list) {
        r -= Math.max(0, getWeight(item));
        if (r <= 0) return item;
      }
      return list[list.length - 1];
    }

    function getItemSpawnRate() {
      if (selectedDiff === 'easy') return 0.14;
      if (selectedDiff === 'hard') return 0.10;
      return 0.12;
    }

    function encodeCell(colorIndex1, itemTypeId = 0) {
      if (!itemTypeId) return colorIndex1;
      return ITEM_OFFSET + itemTypeId * 10 + colorIndex1;
    }

    function decodeCell(cell) {
      if (!cell) return { empty: true };
      if (cell >= ITEM_OFFSET) {
        const itemTypeId = Math.floor((cell - ITEM_OFFSET) / 10);
        const colorIndex1 = cell % 10;
        return { empty: false, itemTypeId, colorIndex1 };
      }
      return { empty: false, itemTypeId: 0, colorIndex1: cell };
    }

    function getItemById(id) {
      for (const entry of ITEM_LIST) {
        if (entry.type.id === id) return entry.type;
      }
      return null;
    }

    function updateItemBar() {
      const bar = document.getElementById('itemBar');
      if (gameMode !== 'items' || gameState !== 'playing') {
        bar.classList.add('hidden');
        bar.innerHTML = '';
        return;
      }
      bar.classList.remove('hidden');
      let html = '';
      for (let i = 0; i < INVENTORY_SIZE; i++) {
        const itemId = inventory[i] || 0;
        if (!itemId) {
          html += `<div class="item-slot empty" data-slot="${i}">·<div class="keycap">${i+1}</div></div>`;
        } else {
          const meta = getItemById(itemId);
          const icon = meta ? meta.icon : '?';
          html += `<div class="item-slot" data-slot="${i}">${icon}<div class="keycap">${i+1}</div></div>`;
        }
      }
      bar.innerHTML = html;
      bar.querySelectorAll('.item-slot').forEach(el => {
        el.addEventListener('click', () => {
          const idx = parseInt(el.dataset.slot);
          useItemAt(idx);
        });
        el.addEventListener('touchend', e => {
          e.preventDefault();
          const idx = parseInt(el.dataset.slot);
          useItemAt(idx);
        });
      });
    }

    function showScoreDelta(points) {
      const el = document.getElementById('scoreDelta');
      el.textContent = points > 0 ? `+${points}` : `${points}`;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 260);
    }

    function bumpScore() {
      const el = document.getElementById('score');
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }

    function addScore(points, toastText = '', toastColor = '#64ffda', showDelta = true) {
      addScorePart('misc', points, toastText, toastColor, showDelta);
    }

    function addScorePart(part, basePoints, toastText = '', toastColor = '#64ffda', showDelta = true) {
      if (!basePoints) return;
      const mult = DIFF_CONFIG[selectedDiff].scoreMult || 1.0;
      const points = Math.round(basePoints * mult);
      score += points;
      scoreParts[part] = (scoreParts[part] || 0) + points;
      document.getElementById('score').textContent = score;
      if (toastText) showToast(toastText, toastColor);
      if (showDelta) showScoreDelta(points);
      bumpScore();
      if (part === 'balance') { playSfx('clear2'); vibrate([12, 20, 12]); }
      if (part === 'itemUse') { playSfx('itemUse'); vibrate(18); }
    }

    function onOrient(e) {
      if (gameState !== 'playing') return;
      const gx = e.gamma || 0;
      const gy = e.beta  || 0;
      tiltX = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, gx));
      tiltY = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, gy));
    }

    function renderIdle() {
      const { maxW, maxH } = getCanvasBounds();
      COLS = selectedSize;
      ROWS = selectedSize;
      CELL = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
      canvas.width  = COLS * CELL;
      canvas.height = ROWS * CELL;
      document.getElementById('gameContainer').style.width  = canvas.width  + 'px';
      document.getElementById('gameContainer').style.height = canvas.height + 'px';
      gameMode = selectedMode;
      if (!grid || grid.length !== ROWS || !grid[0] || grid[0].length !== COLS) {
        grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
      }
      piece = null;
      pendingTarget = null;
      render();
      updateRestartVisibility();
      updateInfoVisibility();
    }

    // ============== 开始 ==============
    function startGame() {
      try {
        if (soundOn) unlockAudioFromGesture();
        playSfx('start');
        if (bgmSwitchTimer) {
          clearTimeout(bgmSwitchTimer);
          bgmSwitchTimer = null;
        }
        requestSensorPermission();
        resetKeyboardInput();
        const { maxW, maxH } = getCanvasBounds();
        COLS = selectedSize;
        ROWS = selectedSize;
        CELL = Math.floor(Math.min(maxW / COLS, maxH / ROWS));
        canvas.width  = COLS * CELL;
        canvas.height = ROWS * CELL;
        document.getElementById('gameContainer').style.width  = canvas.width  + 'px';
        document.getElementById('gameContainer').style.height = canvas.height + 'px';

        document.getElementById('overlay').classList.add('hidden');
        document.getElementById('deadOverlay').classList.add('hidden');
        document.getElementById('pauseSettingsRow').classList.add('hidden');
        gameMode = selectedMode;
        document.getElementById('modeLabel').textContent = `${COLS}×${ROWS} · ${GAME_MODE[gameMode].label} · ${DIFF_CONFIG[selectedDiff].label}`;

        grid = Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
        score = 0;
        tiltX = 0; tiltY = 0;
        moveAccX = 0; moveAccY = 0;
        piecePlaced = 0;
        inventory = [];
        clears = 0;
        maxFill = 0;
        itemUseCount = 0;
        metricsAcc = 0;
        currentFillPct = 0;
        worldPickups = [];
        explosions = [];
        particles = [];
        scoreParts = { placement: 0, clear: 0, balance: 0, itemCollect: 0, itemUse: 0 };
        document.getElementById('score').textContent = 0;
        const clearsEl = document.getElementById('clears');
        if (clearsEl) clearsEl.textContent = '0';
        const fillEl = document.getElementById('fill');
        if (fillEl) fillEl.textContent = '0%';
        gameState = 'playing';
        updateRestartVisibility();
        updateInfoVisibility();
        updatePauseVisibility();
        updateSettingsButtons();
        setPausedUI(false);
        updateItemBar();
        spawnPiece();
        maybeShowFirstTimeHints();
        lastTime = performance.now();
        syncAudioState();
        requestAnimationFrame(loop);
      } catch (err) {
        showToast(err ? String(err) : '无法开始', '#ff6b6b', 1800);
        throw err;
      }
    }

    function maybeShowFirstTimeHints() {
      const key = 'grav_tutorial_v1';
      if (localStorage.getItem(key)) return;
      localStorage.setItem(key, '1');
      const seq = [
        { t: 0,    text: '新手提示：倾斜手机控制，贴边滑行', color: '#ffd93d' },
        { t: 1200, text: '红色区域是斩杀线，占到就失败', color: '#ff6b6b' },
        { t: 2400, text: '道具：点击背包道具 → 再点空格使用', color: '#ffd93d' },
        { t: 3600, text: '点燃炸弹 3 秒爆，注意闪烁与警告圈', color: '#ff6b6b' },
      ];
      for (const it of seq) setTimeout(() => showToast(it.text, it.color, 1100), it.t);
    }

    function getCanvasBounds() {
      const base = 680;
      let maxPx = Math.max(280, Math.min(base, window.innerWidth - 40, window.innerHeight - 120));
      if (window.innerWidth <= 760) {
        const reserved = gameState === 'playing' ? 300 : 180;
        maxPx = Math.max(240, Math.min(base, window.innerWidth - 20, window.innerHeight - reserved));
      }
      return { maxW: maxPx, maxH: maxPx };
    }

    // ============== 生成方块 ==============
    function spawnPiece() {
      const shapePool = COLS <= 10
        ? SHAPE_DEFS.filter(s => s.shape.length <= 3 && s.weight > 0)
        : SHAPE_DEFS.filter(s => s.shape.length > 1 && s.weight > 0);
      const shapeDef = weightedPick(shapePool, s => s.weight);
      const shape = shapeDef.shape;
      const color = Math.floor(Math.random() * COLORS.length);

      // 计算形状偏移使其居中生成
      const maxPx = Math.max(...shape.map(([x]) => x));
      const maxPy = Math.max(...shape.map(([, y]) => y));
      const cx = Math.floor((COLS - maxPx - 1) / 2);
      const cy = Math.floor((ROWS - maxPy - 1) / 2);

      let itemTypeId = 0;
      let itemIndex = -1;
      if (gameMode === 'items' && Math.random() < getItemSpawnRate()) {
        const entry = weightedPick(ITEM_LIST, e => e.weight);
        itemTypeId = entry.type.id;
        itemIndex = Math.floor(Math.random() * shape.length);
      }
      piece = { x: cx, y: cy, renderX: cx, renderY: cy, blockedMs: 0, color, shape, itemTypeId, itemIndex };

      if (overlapsGrid(piece.x, piece.y, piece.shape)) {
        gameOver();
      }
    }

    // ============== 主循环 ==============
    function loop(ts) {
      if (gameState !== 'playing') return;
      const dt = Math.min(ts - lastTime, 100);
      lastTime = ts;
      update(dt);
      updateEffects(dt);
      updateMetrics(dt);
      refreshScorePanel();
      render();
      requestAnimationFrame(loop);
    }

    function updateMetrics(dt) {
      metricsAcc += dt;
      if (metricsAcc < 160) return;
      metricsAcc = 0;
      const total = COLS * ROWS;
      let filled = 0;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (grid[y][x]) filled += 1;
        }
      }
      const pct = total > 0 ? Math.min(100, Math.round((filled / total) * 100)) : 0;
      currentFillPct = pct;
      if (pct > maxFill) maxFill = pct;
      const fillEl = document.getElementById('fill');
      if (fillEl) fillEl.textContent = `${pct}%`;
    }

    function updateEffects(dt) {
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.t += dt;
        if (ex.t >= ex.maxT) explosions.splice(i, 1);
      }
      for (let i = lineFlashes.length - 1; i >= 0; i--) {
        const lf = lineFlashes[i];
        lf.t += dt;
        if (lf.t >= lf.maxT) lineFlashes.splice(i, 1);
      }
      for (let i = landBounces.length - 1; i >= 0; i--) {
        const b = landBounces[i];
        b.t += dt;
        if (b.t >= b.maxT) landBounces.splice(i, 1);
      }
      for (let i = flyItems.length - 1; i >= 0; i--) {
        const f = flyItems[i];
        f.t += dt;
        if (f.t >= f.maxT) flyItems.splice(i, 1);
      }
      if (screenShake.maxT > 0) {
        screenShake.t += dt;
        if (screenShake.t >= screenShake.maxT) screenShake = { t: 0, maxT: 0, amp: 0 };
      }
      if (screenFlash.maxT > 0) {
        screenFlash.t += dt;
        if (screenFlash.t >= screenFlash.maxT) screenFlash = { t: 0, maxT: 0, color: 'rgba(0,0,0,0)' };
      }
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.t += dt;
        p.x += p.vx * (dt / 16.67) * CELL * 0.05;
        p.y += p.vy * (dt / 16.67) * CELL * 0.05;
        p.vx *= 0.985;
        p.vy *= 0.985;
        if (p.t >= p.life) particles.splice(i, 1);
      }
    }

    function triggerShake(amp = 8, ms = 180) {
      screenShake = { t: 0, maxT: ms, amp: amp };
    }

    function triggerFlash(color = 'rgba(100,255,218,0.18)', ms = 140) {
      screenFlash = { t: 0, maxT: ms, color };
    }

    function smoothFollow(current, target, dt, smoothMs) {
      const k = 1 - Math.exp(-dt / Math.max(1, smoothMs));
      return current + (target - current) * k;
    }

    function tiltToSpeed(absTilt, speedMult) {
      const a = Math.max(0, Math.min(MAX_ANGLE, absTilt));
      const norm = Math.max(0, (a - TILT_DEADZONE) / Math.max(1, (MAX_ANGLE - TILT_DEADZONE)));
      const curved = Math.pow(norm, MOVE_CURVE_EXP);
      return curved * MAX_SPEED_CELLS_PER_SEC * speedMult;
    }

    // ============== 更新（核心：下一步碰才停）==============
    function update(dt) {
      if (!piece) return;
      if (piece.renderX === undefined) piece.renderX = piece.x;
      if (piece.renderY === undefined) piece.renderY = piece.y;
      piece.renderX = smoothFollow(piece.renderX, piece.x, dt, MOVE_SMOOTH_MS);
      piece.renderY = smoothFollow(piece.renderY, piece.y, dt, MOVE_SMOOTH_MS);
      if (piece.blockedMs === undefined) piece.blockedMs = 0;

      const speedMult = DIFF_CONFIG[selectedDiff].speedMult;
      const ax = Math.abs(tiltX);
      const ay = Math.abs(tiltY);
      const sx = tiltToSpeed(ax, speedMult);
      const sy = tiltToSpeed(ay, speedMult);
      const hasX = sx > 0.001;
      const hasY = sy > 0.001;
      if (piece.isLitBomb) {
        moveAccX += (hasX ? (sx * dt) / 1000 : 0);
        while (moveAccX >= 1) {
          moveAccX -= 1;
          const dx = tiltX < 0 ? -1 : 1;
          const nx = piece.x + dx;
          if (!outOfBounds(nx, piece.y, piece.shape) && !overlapsGrid(nx, piece.y, piece.shape)) {
            piece.x = nx;
            playSfx('move');
          } else {
            break;
          }
        }

        moveAccY += (hasY ? (sy * dt) / 1000 : 0);
        while (moveAccY >= 1) {
          moveAccY -= 1;
          const dy = tiltY < 0 ? -1 : 1;
          const ny = piece.y + dy;
          if (!outOfBounds(piece.x, ny, piece.shape) && !overlapsGrid(piece.x, ny, piece.shape)) {
            piece.y = ny;
            playSfx('move');
          } else {
            break;
          }
        }

        const now = performance.now();
        if (now >= piece.bombEndsAt) {
          const { x: cx, y: cy } = getPieceCenterCell(piece);
          piece = null;
          explode3x3(cx, cy, true);
          const removed = checkLines();
          if (gameState !== 'playing') return;
          applyBalanceReward(removed);
          maybeSpawnWorldPickup();
          spawnPiece();
        }
        return;
      }

      let moved = false;
      const primary = (sx >= sy) ? 'x' : 'y';
      const order = primary === 'x' ? ['x', 'y'] : ['y', 'x'];
      for (const axis of order) {
        if (axis === 'x') {
          moveAccX += (hasX ? (sx * dt) / 1000 : 0);
          while (moveAccX >= 1) {
            moveAccX -= 1;
            const dx = tiltX < 0 ? -1 : 1;
            const nx = piece.x + dx;
            if (!outOfBounds(nx, piece.y, piece.shape) && !overlapsGrid(nx, piece.y, piece.shape)) {
              piece.x = nx;
              moved = true;
              playSfx('move');
            } else {
              break;
            }
          }
        } else {
          moveAccY += (hasY ? (sy * dt) / 1000 : 0);
          while (moveAccY >= 1) {
            moveAccY -= 1;
            const dy = tiltY < 0 ? -1 : 1;
            const ny = piece.y + dy;
            if (!outOfBounds(piece.x, ny, piece.shape) && !overlapsGrid(piece.x, ny, piece.shape)) {
              piece.y = ny;
              moved = true;
              playSfx('move');
            } else {
              break;
            }
          }
        }
      }

      // 锁定判定：
      // 当且仅当 倾斜方向的"下一格"是墙/方块 时，才锁定（固定当前方块）
      if (shouldSettle(dt, moved)) {
        settlePiece();
        if (gameState !== 'playing') return;
        const removed = checkLines();
        if (gameState !== 'playing') return;
        applyBalanceReward(removed);
        maybeSpawnWorldPickup();
        if (maybeSpawnLitBombEvent()) return;
        spawnPiece();
      }
    }

    // 判定是否需要固定：所有正在倾斜的方向的下一格都被阻挡
    function shouldSettle(dt, moved) {
      const activeX = Math.abs(tiltX) >= MIN_ANGLE;
      const activeY = Math.abs(tiltY) >= MIN_ANGLE;
      if (!activeX && !activeY) {
        piece.blockedMs = 0;
        return false;
      }
      if (moved) {
        piece.blockedMs = 0;
        return false;
      }

      const dx = tiltX < 0 ? -1 : 1;
      const dy = tiltY < 0 ? -1 : 1;
      const xBlocked = activeX ? (outOfBounds(piece.x + dx, piece.y, piece.shape) || overlapsGrid(piece.x + dx, piece.y, piece.shape)) : false;
      const yBlocked = activeY ? (outOfBounds(piece.x, piece.y + dy, piece.shape) || overlapsGrid(piece.x, piece.y + dy, piece.shape)) : false;

      // 双轴倾斜时：主轴优先，接近等幅时任一阻挡即可固定，降低传感器抖动导致的漏判。
      const ax = Math.abs(tiltX);
      const ay = Math.abs(tiltY);
      let settleCond = false;
      if (activeX && activeY) {
        if (Math.abs(ax - ay) <= 4) settleCond = xBlocked || yBlocked;
        else settleCond = ax > ay ? xBlocked : yBlocked;
      } else if (activeX) {
        settleCond = xBlocked;
      } else {
        settleCond = yBlocked;
      }

      if (!settleCond) {
        piece.blockedMs = 0;
        return false;
      }
      piece.blockedMs += dt;
      return piece.blockedMs >= SETTLE_DELAY_MS;
    }

    // ============== 边界/重叠检查 ==============
    function outOfBounds(x, y, shape) {
      for (const [px, py] of shape) {
        const wx = x + px, wy = y + py;
        if (wx < 0 || wx >= COLS || wy < 0 || wy >= ROWS) return true;
      }
      return false;
    }

    function overlapsGrid(x, y, shape) {
      for (const [px, py] of shape) {
        const wx = x + px, wy = y + py;
        if (wy >= 0 && wy < ROWS && wx >= 0 && wx < COLS) {
          if (grid[wy][wx] !== 0) return true;
        }
      }
      return false;
    }

    function centerRadius() {
      if (COLS <= 10) return 1;
      if (COLS <= 15) return 2;
      return 3;
    }

    function isInCenterZone(x, y) {
      const r = centerRadius();
      const cx = Math.floor(COLS / 2);
      const cy = Math.floor(ROWS / 2);
      return Math.abs(x - cx) <= r && Math.abs(y - cy) <= r;
    }

    function isKillZoneOccupied() {
      const r = centerRadius();
      const cx = Math.floor(COLS / 2);
      const cy = Math.floor(ROWS / 2);
      for (let y = cy - r; y <= cy + r; y++) {
        for (let x = cx - r; x <= cx + r; x++) {
          if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
          if (grid[y][x]) return true;
        }
      }
      return false;
    }

    function failIfKillZoneOccupied() {
      if (!isKillZoneOccupied()) return false;
      gameOver('斩杀线被占');
      return true;
    }

    function showToast(text, color = '#ffd93d', ms = 900) {
      const el = document.getElementById('toast');
      el.textContent = text;
      el.style.borderColor = 'rgba(255,255,255,0.16)';
      el.style.color = color;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove('show');
      }, ms);
    }

    function getPickupCap() {
      if (COLS <= 10) return 1;
      if (COLS <= 15) return 2;
      return 3;
    }

    function getPickupRollProb(fillPct) {
      if (fillPct < 30) return 0.15;
      if (fillPct < 45) return 0.30;
      if (fillPct < 60) return 0.45;
      return 0.60;
    }

    function getLitBombProb(fillPct) {
      if (fillPct < 30) return 0.08;
      if (fillPct < 45) return 0.14;
      if (fillPct < 60) return 0.20;
      return 0.28;
    }

    function getCenterCell() {
      return { x: Math.floor(COLS / 2), y: Math.floor(ROWS / 2) };
    }

    function getPieceCenterCell(p) {
      if (!p || !p.shape || p.shape.length === 0) return getCenterCell();
      let sx = 0, sy = 0;
      for (const [px, py] of p.shape) {
        sx += p.x + px;
        sy += p.y + py;
      }
      return {
        x: Math.max(0, Math.min(COLS - 1, Math.round(sx / p.shape.length))),
        y: Math.max(0, Math.min(ROWS - 1, Math.round(sy / p.shape.length))),
      };
    }

    function findEmptyCellNearCenter() {
      const { x: cx, y: cy } = getCenterCell();
      if (!grid[cy][cx] && !isInCenterZone(cx, cy)) return { x: cx, y: cy };
      const maxR = Math.max(COLS, ROWS);
      for (let r = 0; r <= maxR; r++) {
        for (let dy = -r; dy <= r; dy++) {
          for (let dx = -r; dx <= r; dx++) {
            const x = cx + dx;
            const y = cy + dy;
            if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
            if (isInCenterZone(x, y)) continue;
            if (grid[y][x]) continue;
            const exists = worldPickups.some(p => p.x === x && p.y === y);
            if (exists) continue;
            return { x, y };
          }
        }
      }
      return null;
    }

    function maybeSpawnWorldPickup() {
      if (gameMode !== 'items') return;
      const cap = getPickupCap();
      if (worldPickups.length >= cap) return;
      if (piecePlaced === 0) return;
      if (piecePlaced % WORLD_PICKUP_TRIGGER_EVERY !== 0) return;
      if (Math.random() > getPickupRollProb(currentFillPct)) return;
      spawnWorldPickup();
    }

    function spawnWorldPickup() {
      const spot = findEmptyCellNearCenter();
      if (!spot) return;
      const entry = weightedPick(ITEM_LIST, e => e.weight);
      worldPickups.push({ x: spot.x, y: spot.y, itemTypeId: entry.type.id });
    }

    function maybeSpawnLitBombEvent() {
      if (gameMode !== 'items') return false;
      if (piece && piece.isLitBomb) return false;
      if (piecePlaced === 0) return false;
      if (piecePlaced % LIT_BOMB_TRIGGER_EVERY !== 0) return false;
      if (Math.random() > getLitBombProb(currentFillPct)) return false;
      const { x: cx, y: cy } = getCenterCell();
      const bomb = { x: cx, y: cy, renderX: cx, renderY: cy, blockedMs: 0, color: 0, shape: [[0,0]], itemTypeId: 0, itemIndex: -1, isLitBomb: true, bombEndsAt: performance.now() + LIT_BOMB_MS };
      if (overlapsGrid(bomb.x, bomb.y, bomb.shape)) {
        explode3x3(cx, cy, true);
        spawnPiece();
        return true;
      }
      piece = bomb;
      showToast('点燃炸弹出现！', '#ff6b6b', 650);
      playSfx('itemUse');
      return true;
    }

    function pushInventory(itemTypeId, toastText = '') {
      if (inventory.length >= INVENTORY_SIZE) {
        const removed = inventory.shift();
        const removedMeta = removed ? getItemById(removed) : null;
        const removedName = removedMeta ? removedMeta.icon : '';
        showToast(`背包已满：替换最早道具 ${removedName}`, '#ffd93d');
      }
      inventory.push(itemTypeId);
      updateItemBar();
      if (toastText) showToast(toastText, '#ffd93d');
    }

    function getInventorySlotCanvasPos(slotIndex) {
      const bar = document.getElementById('itemBar');
      if (!bar) return null;
      const slots = bar.querySelectorAll('.item-slot');
      const el = slots && slots[slotIndex];
      if (!el) return null;
      const cr = canvas.getBoundingClientRect();
      const r = el.getBoundingClientRect();
      const scaleX = cr.width > 0 ? (canvas.width / cr.width) : 1;
      const scaleY = cr.height > 0 ? (canvas.height / cr.height) : 1;
      return {
        x: (r.left + r.width / 2 - cr.left) * scaleX,
        y: (r.top + r.height / 2 - cr.top) * scaleY,
      };
    }

    function getItemTint(itemTypeId) {
      const coldBombId = ITEM_TYPES.coldBomb ? ITEM_TYPES.coldBomb.id : 0;
      const defuseId = ITEM_TYPES.defuse ? ITEM_TYPES.defuse.id : 0;
      const magnetId = ITEM_TYPES.magnet ? ITEM_TYPES.magnet.id : 0;
      if (coldBombId && itemTypeId === coldBombId) return 'rgba(255,107,107,1)';
      if (defuseId && itemTypeId === defuseId) return 'rgba(100,255,218,1)';
      if (itemTypeId === ITEM_TYPES.laser.id) return 'rgba(107,203,255,1)';
      if (magnetId && itemTypeId === magnetId) return 'rgba(199,146,234,1)';
      return 'rgba(255,217,61,1)';
    }

    function collectWorldPickupAt(x, y) {
      if (gameMode !== 'items') return false;
      const idx = worldPickups.findIndex(p => p.x === x && p.y === y);
      if (idx < 0) return false;
      const p = worldPickups[idx];
      worldPickups.splice(idx, 1);
      pushInventory(p.itemTypeId);
      const slotIndex = Math.max(0, Math.min(INVENTORY_SIZE - 1, inventory.length - 1));
      const end = getInventorySlotCanvasPos(slotIndex);
      if (end) {
        const meta = getItemById(p.itemTypeId);
        flyItems.push({
          sx: (x + 0.5) * CELL,
          sy: (y + 0.5) * CELL,
          ex: end.x,
          ey: end.y,
          t: 0,
          maxT: 520,
          color: getItemTint(p.itemTypeId),
          label: meta ? meta.label : '',
        });
      }
      playSfx('itemCollect');
      addScorePart('itemCollect', ITEM_SCORES.collect, `获得道具 +${ITEM_SCORES.collect}`, '#ffd93d');
      return true;
    }

    function collectPickupsForCurrentPiece() {
      if (gameMode !== 'items') return;
      if (!piece) return;
      if (pendingTarget) return;
      if (piece.isLitBomb) return;
      for (const [px, py] of piece.shape) {
        const wx = piece.x + px;
        const wy = piece.y + py;
        if (wx < 0 || wx >= COLS || wy < 0 || wy >= ROWS) continue;
        if (collectWorldPickupAt(wx, wy)) return;
      }
    }

    function explode3x3(cx, cy, isLit) {
      let cleared = 0;
      const removedPickups = [];
      for (let y = cy - 1; y <= cy + 1; y++) {
        for (let x = cx - 1; x <= cx + 1; x++) {
          if (x < 0 || x >= COLS || y < 0 || y >= ROWS) continue;
          const cell = grid[y][x];
          if (cell) {
            grid[y][x] = 0;
            cleared += 1;
          }
          for (let i = worldPickups.length - 1; i >= 0; i--) {
            const p = worldPickups[i];
            if (p.x === x && p.y === y) {
              removedPickups.push(worldPickups[i]);
              worldPickups.splice(i, 1);
            }
          }
        }
      }

      const scorePer = isLit ? ITEM_SCORES.litBombPerCell : ITEM_SCORES.coldBombPerCell;
      if (cleared > 0) addScorePart('itemUse', cleared * scorePer, isLit ? `爆炸 +${cleared * scorePer}` : `小炸弹 +${cleared * scorePer}`, '#ff6b6b');

      const ex = { x: cx, y: cy, t: 0, maxT: 520, isLit };
      explosions.push(ex);
      for (let i = 0; i < 44; i++) {
        const ang = Math.random() * Math.PI * 2;
        const sp = 0.7 + Math.random() * 2.2;
        particles.push({
          x: (cx + 0.5) * CELL,
          y: (cy + 0.5) * CELL,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp,
          life: 520 + Math.random() * 220,
          t: 0,
          size: 1.6 + Math.random() * 2.8,
        });
      }
      vibrate(isLit ? [18, 30, 18] : 18);
    }
    function collectItem(itemTypeId) {
      if (gameMode !== 'items') return;
      if (inventory.length >= INVENTORY_SIZE) {
        showToast('道具已满', '#ffd93d');
        return;
      }
      inventory.push(itemTypeId);
      playSfx('itemCollect');
      updateItemBar();
      addScorePart('itemCollect', ITEM_SCORES.collect, `获得道具 +${ITEM_SCORES.collect}`, '#ffd93d');
    }

    function useItemAt(slotIndex) {
      if (gameState !== 'playing') return;
      if (gameMode !== 'items') return;
      const itemTypeId = inventory[slotIndex];
      if (!itemTypeId) return;
      const coldBombId = ITEM_TYPES.coldBomb ? ITEM_TYPES.coldBomb.id : 0;
      const magnetId = ITEM_TYPES.magnet ? ITEM_TYPES.magnet.id : 0;
      const needsTarget =
        (coldBombId && itemTypeId === coldBombId && typeof useColdBombAt === 'function') ||
        (itemTypeId === ITEM_TYPES.laser.id && typeof useLaserAt === 'function') ||
        (magnetId && itemTypeId === magnetId);
      if (needsTarget) {
        if (pendingTarget && pendingTarget.slotIndex === slotIndex && pendingTarget.itemTypeId === itemTypeId) {
          pendingTarget = null;
          aimCell = null;
          updateItemBar();
          return;
        }
        pendingTarget = { slotIndex, itemTypeId };
        pendingTargetPulseT = performance.now();
        aimCell = null;
        const k = 'grav_first_item_hint_v1';
        if (!localStorage.getItem(k)) {
          localStorage.setItem(k, '1');
          showToast('提示：选道具后，再点棋盘空格使用', '#ffd93d', 1200);
        } else {
          showToast('点击棋盘空格使用', '#ffd93d', 900);
        }
        updateItemBar();
        return;
      }

      inventory.splice(slotIndex, 1);
      updateItemBar();
      itemUseCount += 1;
      useItem(itemTypeId);
    }

    function useItem(itemTypeId) {
      if (itemTypeId === ITEM_TYPES.bomb.id) return useBomb();
      if (itemTypeId === ITEM_TYPES.fill.id) return useFill();
      if (itemTypeId === ITEM_TYPES.laser.id) return useLaser();
      if (itemTypeId === ITEM_TYPES.clean.id) return useClean();
      if (itemTypeId === ITEM_TYPES.single.id) return useSingleify();
      if (itemTypeId === ITEM_TYPES.shuffle.id) return useShuffle();
    }

    function useBomb() {
      const rows = Math.min(3, ROWS);
      let cleared = 0;
      for (let y = ROWS - 1; y >= ROWS - rows; y--) {
        for (let x = 0; x < COLS; x++) {
          const cell = grid[y][x];
          if (!cell) continue;
          const { itemTypeId } = decodeCell(cell);
          if (itemTypeId) collectItem(itemTypeId);
          grid[y][x] = 0;
          cleared += 1;
        }
      }
      addScorePart('itemUse', cleared * ITEM_SCORES.bombPerCell, `炸弹 +${cleared * ITEM_SCORES.bombPerCell}`, '#ff6b6b');
      const removed = checkLines();
      applyBalanceReward(removed);
    }

    function useLaser() {
      if (!piece) {
        showToast('没有可用目标', '#ffd93d');
        return;
      }
      let sx = 0, sy = 0;
      for (const [px, py] of piece.shape) {
        sx += piece.x + px;
        sy += piece.y + py;
      }
      const tx = Math.max(0, Math.min(COLS - 1, Math.round(sx / piece.shape.length)));
      const ty = Math.max(0, Math.min(ROWS - 1, Math.round(sy / piece.shape.length)));

      let cleared = 0;
      for (let x = 0; x < COLS; x++) {
        const cell = grid[ty][x];
        if (!cell) continue;
        const { itemTypeId } = decodeCell(cell);
        if (itemTypeId) collectItem(itemTypeId);
        grid[ty][x] = 0;
        cleared += 1;
      }
      for (let y = 0; y < ROWS; y++) {
        const cell = grid[y][tx];
        if (!cell) continue;
        const { itemTypeId } = decodeCell(cell);
        if (itemTypeId) collectItem(itemTypeId);
        grid[y][tx] = 0;
        cleared += 1;
      }
      addScorePart('itemUse', cleared * ITEM_SCORES.laserPerCell, `激光 +${cleared * ITEM_SCORES.laserPerCell}`, '#6bcbff');
      const removed = checkLines();
      applyBalanceReward(removed);
      playSfx('itemUse');
      return true;
    }

    function useMagnetAt(tx, ty) {
      const radius = 2;
      const coords = [];
      for (let y = Math.max(0, ty - radius); y <= Math.min(ROWS - 1, ty + radius); y++) {
        for (let x = Math.max(0, tx - radius); x <= Math.min(COLS - 1, tx + radius); x++) {
          if (!grid[y][x]) continue;
          const dist = Math.abs(tx - x) + Math.abs(ty - y);
          coords.push({ x, y, dist });
        }
      }
      coords.sort((a, b) => b.dist - a.dist);
      let moved = 0;
      for (const c of coords) {
        const v = grid[c.y][c.x];
        if (!v) continue;
        const dx = tx === c.x ? 0 : (tx > c.x ? 1 : -1);
        const dy = ty === c.y ? 0 : (ty > c.y ? 1 : -1);
        let nx = c.x;
        let ny = c.y;
        if (Math.abs(tx - c.x) >= Math.abs(ty - c.y)) nx = c.x + dx;
        else ny = c.y + dy;
        if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
        if (grid[ny][nx]) continue;
        grid[ny][nx] = v;
        grid[c.y][c.x] = 0;
        moved += 1;
      }
      if (ITEM_SCORES.magnet) addScorePart('itemUse', ITEM_SCORES.magnet, `磁铁 +${ITEM_SCORES.magnet}`, '#64ffda');
      showToast(moved > 0 ? '磁吸！' : '磁铁无效', '#64ffda', 650);
      const removed = checkLines();
      applyBalanceReward(removed);
      playSfx('itemUse');
      return true;
    }

    function isPickupCell(x, y) {
      return worldPickups.some(p => p.x === x && p.y === y);
    }

    function usePendingItemAtCell(x, y) {
      if (!pendingTarget) return false;
      if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return false;
      if (grid[y][x] !== 0) {
        showToast('请选择空格', '#ffd93d', 700);
        return false;
      }
      if (isPickupCell(x, y)) {
        showToast('该格有拾取点', '#ffd93d', 700);
        return false;
      }
      if (isInCenterZone(x, y)) {
        showToast('斩杀线不可用', '#ff6b6b', 700);
        return false;
      }

      const { itemTypeId, slotIndex } = pendingTarget;
      const coldBombId = ITEM_TYPES.coldBomb ? ITEM_TYPES.coldBomb.id : 0;
      const magnetId = ITEM_TYPES.magnet ? ITEM_TYPES.magnet.id : 0;
      let ok = false;
      if (coldBombId && itemTypeId === coldBombId && typeof useColdBombAt === 'function') ok = useColdBombAt(x, y);
      else if (itemTypeId === ITEM_TYPES.laser.id && typeof useLaserAt === 'function') ok = useLaserAt(x, y);
      else if (magnetId && itemTypeId === magnetId) ok = useMagnetAt(x, y);
      else ok = false;
      if (!ok) return false;

      const realId = inventory[slotIndex];
      if (realId !== itemTypeId) {
        const idx = inventory.findIndex(v => v === itemTypeId);
        if (idx >= 0) inventory.splice(idx, 1);
      } else {
        inventory.splice(slotIndex, 1);
      }
      updateItemBar();
      itemUseCount += 1;
      pendingTarget = null;
      updateItemBar();
      return true;
    }

    function useClean() {
      const present = new Set();
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = grid[y][x];
          if (!cell) continue;
          const { colorIndex1 } = decodeCell(cell);
          present.add(colorIndex1);
        }
      }
      if (present.size === 0) {
        showToast('盘面为空', '#ffd93d');
        return;
      }
      const arr = Array.from(present);
      const target = arr[Math.floor(Math.random() * arr.length)];
      let cleared = 0;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = grid[y][x];
          if (!cell) continue;
          const { itemTypeId, colorIndex1 } = decodeCell(cell);
          if (colorIndex1 !== target) continue;
          if (itemTypeId) collectItem(itemTypeId);
          grid[y][x] = 0;
          cleared += 1;
        }
      }
      addScorePart('itemUse', cleared * ITEM_SCORES.cleanPerCell, `清扫 +${cleared * ITEM_SCORES.cleanPerCell}`, '#ffd93d');
      const removed = checkLines();
      applyBalanceReward(removed);
    }

    function useFill() {
      const holes = [];
      for (let x = 0; x < COLS; x++) {
        let seenBlock = false;
        for (let y = 0; y < ROWS; y++) {
          if (grid[y][x]) {
            seenBlock = true;
            continue;
          }
          if (seenBlock) holes.push({ x, y });
        }
      }
      holes.sort((a, b) => b.y - a.y);
      const count = Math.min(5, holes.length);
      for (let i = 0; i < count; i++) {
        const { x, y } = holes[i];
        const colorIndex1 = Math.floor(Math.random() * COLORS.length) + 1;
        if (isInCenterZone(x, y)) continue;
        grid[y][x] = encodeCell(colorIndex1, 0);
      }
      addScorePart('itemUse', count * ITEM_SCORES.fillPerCell, `填补 +${count * ITEM_SCORES.fillPerCell}`, '#c792ea');
      const removed = checkLines();
      applyBalanceReward(removed);
    }

    function useSingleify() {
      if (!piece) {
        showToast('没有可变形方块', '#ffd93d');
        return;
      }
      piece.shape = [[0,0]];
      piece.itemTypeId = 0;
      piece.itemIndex = -1;
      if (overlapsGrid(piece.x, piece.y, piece.shape)) {
        let placed = false;
        for (let r = 0; r < Math.max(COLS, ROWS) && !placed; r++) {
          for (let dy = -r; dy <= r && !placed; dy++) {
            for (let dx = -r; dx <= r && !placed; dx++) {
              const nx = piece.x + dx;
              const ny = piece.y + dy;
              if (nx < 0 || nx >= COLS || ny < 0 || ny >= ROWS) continue;
              if (overlapsGrid(nx, ny, piece.shape)) continue;
              piece.x = nx;
              piece.y = ny;
              placed = true;
            }
          }
        }
        if (!placed) gameOver('无处可放');
      }
      showToast('单格化', '#64ffda');
    }

    function useShuffle() {
      for (let x = 0; x < COLS; x++) {
        const col = [];
        for (let y = 0; y < ROWS; y++) {
          const cell = grid[y][x];
          if (cell) col.push(cell);
        }
        for (let y = 0; y < ROWS; y++) grid[y][x] = 0;
        let y = ROWS - 1;
        for (let i = col.length - 1; i >= 0; i--) {
          while (y >= 0 && isInCenterZone(x, y)) y -= 1;
          if (y < 0) break;
          grid[y][x] = col[i];
          y -= 1;
        }
      }
      addScorePart('itemUse', ITEM_SCORES.shuffle, `压缩 +${ITEM_SCORES.shuffle}`, '#64ffda');
      const removed = checkLines();
      applyBalanceReward(removed);
    }

    // ============== 固定 ==============
    function settlePiece() {
      if (!piece) return;
      playSfx('land');
      const c = piece.color + 1;
      piecePlaced += 1;
      const preEdge = getEdgeCounts(2);
      const placedCells = [];
      for (let i = 0; i < piece.shape.length; i++) {
        const [px, py] = piece.shape[i];
        const wx = piece.x + px, wy = piece.y + py;
        if (wx >= 0 && wx < COLS && wy >= 0 && wy < ROWS) {
          if (isInCenterZone(wx, wy)) {
            gameOver('斩杀线被占');
            return;
          }
          const itemTypeId = (gameMode === 'items' && piece.itemTypeId && i === piece.itemIndex) ? piece.itemTypeId : 0;
          grid[wy][wx] = encodeCell(c, itemTypeId);
          placedCells.push({ x: wx, y: wy });
        }
      }
      piece = null;
      updateItemBar();
      const placementScore = computePlacementScore(preEdge, placedCells);
      addScorePart('placement', placementScore, '', '#64ffda', true);
      if (placedCells.length) {
        for (const c2 of placedCells) landBounces.push({ x: c2.x, y: c2.y, t: 0, maxT: 180 });
        triggerShake(6, 120);
      }
    }

    // ============== 消除行列 ==============
    function checkLines() {
      let removed = 0;
      if (failIfKillZoneOccupied()) return 0;

      function spawnLineFx(rowsToClear, colsToClear) {
        const maxP = 90;
        let pCount = 0;
        for (const y of rowsToClear) {
          lineFlashes.push({ kind: 'row', index: y, t: 0, maxT: 240, color: 'rgba(100,255,218,1)' });
          const baseY = (y + 0.5) * CELL;
          const count = Math.min(26, COLS * 2);
          for (let i = 0; i < count && pCount < maxP; i++) {
            const px = (Math.random() * COLS) * CELL;
            const ang = (Math.random() * Math.PI) - Math.PI / 2;
            const sp = 0.6 + Math.random() * 2.0;
            particles.push({
              x: px,
              y: baseY,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp,
              life: 380 + Math.random() * 260,
              t: 0,
              size: 1.6 + Math.random() * 2.8,
              color: 'rgba(100,255,218,0.95)',
            });
            pCount += 1;
          }
        }
        for (const x of colsToClear) {
          lineFlashes.push({ kind: 'col', index: x, t: 0, maxT: 240, color: 'rgba(107,203,255,1)' });
          const baseX = (x + 0.5) * CELL;
          const count = Math.min(26, ROWS * 2);
          for (let i = 0; i < count && pCount < maxP; i++) {
            const py = (Math.random() * ROWS) * CELL;
            const ang = Math.random() * Math.PI * 2;
            const sp = 0.6 + Math.random() * 2.0;
            particles.push({
              x: baseX,
              y: py,
              vx: Math.cos(ang) * sp,
              vy: Math.sin(ang) * sp,
              life: 380 + Math.random() * 260,
              t: 0,
              size: 1.6 + Math.random() * 2.8,
              color: 'rgba(107,203,255,0.95)',
            });
            pCount += 1;
          }
        }
      }

      function rowFull(y) {
        return grid[y].every(c => c !== 0);
      }

      function colFull(x) {
        for (let y = 0; y < ROWS; y++) {
          if (grid[y][x] === 0) return false;
        }
        return true;
      }

      function collectRowItems(y) {
        for (let x = 0; x < COLS; x++) {
          const cell = grid[y][x];
          const { itemTypeId } = decodeCell(cell);
          if (itemTypeId) collectItem(itemTypeId);
        }
      }

      function collectColItems(x) {
        for (let y = 0; y < ROWS; y++) {
          const cell = grid[y][x];
          const { itemTypeId } = decodeCell(cell);
          if (itemTypeId) collectItem(itemTypeId);
        }
      }

      function clearRow(y) {
        for (let x = 0; x < COLS; x++) grid[y][x] = 0;
      }

      function clearCol(x) {
        for (let y = 0; y < ROWS; y++) grid[y][x] = 0;
      }

      const midY = Math.floor(ROWS / 2);
      const midX = Math.floor(COLS / 2);

      function shiftUpStripFrom(edgeY) {
        const midY = Math.floor(ROWS / 2);
        if (midY <= 0) return;
        const startY = Math.max(0, Math.min(edgeY, midY - 1));
        for (let y = startY; y < midY - 1; y++) {
          for (let x = 0; x < COLS; x++) {
            grid[y][x] = grid[y + 1][x];
          }
        }
        for (let x = 0; x < COLS; x++) grid[midY - 1][x] = 0;
      }

      function shiftDownStripTo(edgeY) {
        if (midY >= ROWS) return;
        const endY = Math.max(midY, Math.min(edgeY, ROWS - 1));
        for (let y = endY; y > midY; y--) {
          for (let x = 0; x < COLS; x++) {
            grid[y][x] = grid[y - 1][x];
          }
        }
        for (let x = 0; x < COLS; x++) grid[midY][x] = 0;
      }

      function shiftLeftStripFrom(edgeX) {
        if (midX <= 0) return;
        for (let y = 0; y < ROWS; y++) {
          const startX = Math.max(0, Math.min(edgeX, midX - 1));
          for (let x = startX; x < midX - 1; x++) {
            grid[y][x] = grid[y][x + 1];
          }
          grid[y][midX - 1] = 0;
        }
      }

      function shiftRightStripTo(edgeX) {
        if (midX >= COLS) return;
        const endX = Math.max(midX, Math.min(edgeX, COLS - 1));
        for (let y = 0; y < ROWS; y++) {
          for (let x = endX; x > midX; x--) {
            grid[y][x] = grid[y][x - 1];
          }
          grid[y][midX] = 0;
        }
      }

      while (true) {
        const rowsToClear = [];
        const colsToClear = [];

        for (let y = 0; y < ROWS; y++) {
          if (rowFull(y)) rowsToClear.push(y);
        }
        for (let x = 0; x < COLS; x++) {
          if (colFull(x)) colsToClear.push(x);
        }

        if (rowsToClear.length === 0 && colsToClear.length === 0) break;
        spawnLineFx(rowsToClear, colsToClear);

        for (const y of rowsToClear) {
          collectRowItems(y);
          clearRow(y);
          if (y < midY) shiftUpStripFrom(y);
          else shiftDownStripTo(y);
        }
        for (const x of colsToClear) {
          collectColItems(x);
          clearCol(x);
          if (x < midX) shiftLeftStripFrom(x);
          else shiftRightStripTo(x);
        }

        const stepCount = rowsToClear.length + colsToClear.length;
        removed += stepCount;
        if (failIfKillZoneOccupied()) return removed;
      }

      if (removed > 0) {
        clears += removed;
        const clearsEl = document.getElementById('clears');
        if (clearsEl) clearsEl.textContent = `${clears}`;
        const bonus = [100, 300, 600, 1000, 1500][Math.min(removed - 1, 4)];
        addScorePart('clear', bonus, '', '#64ffda', true);
        const pat = removed >= 3 ? [18, 28, 18, 28, 18] : [14, 22, 14];
        vibrate(pat);
        triggerShake(10 + removed * 3, 180);
        triggerFlash('rgba(100,255,218,0.22)', 160);
        if (removed === 1) playSfx('clear1');
        else if (removed === 2) playSfx('clear2');
        else if (removed === 3) playSfx('clear3');
        else playSfx('clear4');
        flashEffect();
      }
      return removed;
    }

    function flashEffect() {
      let count = 0;
      const t = setInterval(() => {
        ctx.fillStyle = `rgba(100,255,218,${0.24 - count * 0.05})`;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        if (++count >= 5) clearInterval(t);
      }, 30);
    }

    function getEdgeCounts(band = 2) {
      let top = 0, bottom = 0, left = 0, right = 0, total = 0;
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!grid[y][x]) continue;
          total += 1;
          if (y < band) top += 1;
          if (y >= ROWS - band) bottom += 1;
          if (x < band) left += 1;
          if (x >= COLS - band) right += 1;
        }
      }
      return { top, bottom, left, right, total };
    }

    function computePlacementScore(preEdge, placedCells) {
      if (!placedCells.length) return 0;
      const band = 2;
      const cx = Math.floor(COLS / 2);
      const cy = Math.floor(ROWS / 2);
      const edgeValues = [preEdge.top, preEdge.bottom, preEdge.left, preEdge.right];
      const minEdge = Math.min(...edgeValues);

      let edgeCells = 0;
      let underCells = 0;
      let maxDist = 0;

      for (const { x, y } of placedCells) {
        const dist = Math.abs(x - cx) + Math.abs(y - cy);
        if (dist > maxDist) maxDist = dist;

        const isEdge = (x < band) || (x >= COLS - band) || (y < band) || (y >= ROWS - band);
        if (isEdge) edgeCells += 1;

        const dTop = y;
        const dBottom = (ROWS - 1) - y;
        const dLeft = x;
        const dRight = (COLS - 1) - x;
        const minD = Math.min(dTop, dBottom, dLeft, dRight);
        if (minD > 2) continue;

        let side = 'top';
        let sideVal = preEdge.top;
        if (dBottom === minD && preEdge.bottom < sideVal) { side = 'bottom'; sideVal = preEdge.bottom; }
        if (dLeft === minD && preEdge.left < sideVal) { side = 'left'; sideVal = preEdge.left; }
        if (dRight === minD && preEdge.right < sideVal) { side = 'right'; sideVal = preEdge.right; }
        if (sideVal <= minEdge + 1) underCells += 1;
      }

      const base = 6;
      const edgeBonus = edgeCells * 3;
      const farBonus = Math.min(12, Math.floor(maxDist));
      const underBonus = underCells * 4;
      return Math.min(60, base + edgeBonus + farBonus + underBonus);
    }

    function applyBalanceReward(removedLines) {
      if (piecePlaced < 4) return;
      if (piecePlaced % 3 !== 0) return;

      const { top, bottom, left, right, total } = getEdgeCounts(2);

      if (total < Math.max(8, COLS)) return;

      const values = [top, bottom, left, right];
      const maxV = Math.max(...values);
      const minV = Math.min(...values);
      const diff = maxV - minV;

      const threshold = COLS <= 10 ? 4 : COLS <= 15 ? 6 : 8;
      if (diff > threshold) return;

      const base = 120;
      const densityBonus = Math.min(120, Math.floor(total / 8) * 20);
      const clearBonus = removedLines > 0 ? removedLines * 25 : 0;
      const bonus = base + densityBonus + clearBonus;
      addScorePart('balance', bonus, `均衡奖励 +${bonus}`, '#64ffda', true);
    }

    // ============== 渲染 ==============
    function render() {
      const now = performance.now();
      let ox = 0;
      let oy = 0;
      if (screenShake.maxT > 0) {
        const p = Math.min(1, screenShake.t / screenShake.maxT);
        const a = screenShake.amp * (1 - p);
        ox = (Math.random() - 0.5) * a;
        oy = (Math.random() - 0.5) * a;
      }
      ctx.save();
      ctx.translate(ox, oy);
      ctx.fillStyle = '#0d1117';
      ctx.fillRect(-40, -40, canvas.width + 80, canvas.height + 80);

      const r = centerRadius();
      const cx = Math.floor(COLS / 2);
      const cy = Math.floor(ROWS / 2);
      const zx0 = Math.max(0, cx - r) * CELL;
      const zy0 = Math.max(0, cy - r) * CELL;
      const zx1 = (Math.min(COLS - 1, cx + r) + 1) * CELL;
      const zy1 = (Math.min(ROWS - 1, cy + r) + 1) * CELL;
      const zw = zx1 - zx0;
      const zh = zy1 - zy0;
      const zp = 0.55 + 0.45 * Math.sin(now / 260);
      ctx.save();
      ctx.fillStyle = `rgba(255, 107, 107, ${0.12 + 0.05 * zp})`;
      ctx.fillRect(zx0, zy0, zw, zh);
      ctx.beginPath();
      ctx.rect(zx0, zy0, zw, zh);
      ctx.clip();
      ctx.strokeStyle = `rgba(255, 107, 107, ${0.22 + 0.10 * zp})`;
      ctx.lineWidth = Math.max(1, CELL * 0.06);
      const step = Math.max(7, Math.floor(CELL * 0.35));
      for (let i = -zh; i < zw + zh; i += step) {
        ctx.beginPath();
        ctx.moveTo(zx0 + i, zy0);
        ctx.lineTo(zx0 + i + zh, zy0 + zh);
        ctx.stroke();
      }
      ctx.restore();
      ctx.save();
      ctx.strokeStyle = `rgba(255, 107, 107, ${0.78 + 0.18 * zp})`;
      ctx.lineWidth = Math.max(2, CELL * 0.10);
      ctx.setLineDash([Math.max(6, CELL * 0.45), Math.max(4, CELL * 0.28)]);
      ctx.strokeRect(zx0 + 1.5, zy0 + 1.5, zw - 3, zh - 3);
      ctx.setLineDash([]);
      ctx.shadowColor = 'rgba(255,107,107,0.55)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = `rgba(255, 107, 107, ${0.70 + 0.15 * zp})`;
      ctx.font = `${Math.max(12, Math.floor(CELL * 0.55))}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('斩杀线', zx0 + zw / 2, zy0 + zh / 2);
      ctx.restore();

      // 中心十字虚线
      ctx.strokeStyle = 'rgba(100,255,218,0.1)';
      ctx.setLineDash([4, 4]);
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(canvas.width / 2, 0);
      ctx.lineTo(canvas.width / 2, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, canvas.height / 2);
      ctx.lineTo(canvas.width, canvas.height / 2);
      ctx.stroke();
      ctx.setLineDash([]);

      // 网格线
      ctx.strokeStyle = 'rgba(100,255,218,0.05)';
      for (let i = 0; i <= COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i <= ROWS; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // 固定方块
      const bounceMap = new Map();
      for (const b of landBounces) bounceMap.set(`${b.x},${b.y}`, b);
      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (grid[y][x]) {
            const meta = decodeCell(grid[y][x]);
            const item = meta.itemTypeId ? getItemById(meta.itemTypeId) : null;
            const b = bounceMap.get(`${x},${y}`);
            if (b) {
              const p = Math.min(1, b.t / b.maxT);
              const k = Math.sin((1 - p) * Math.PI);
              drawBlockScaled(x, y, COLORS[meta.colorIndex1 - 1], 1 + 0.12 * k, 1, false, item ? item.label : '');
            } else {
              drawBlock(x, y, COLORS[meta.colorIndex1 - 1], 1, false, item ? item.label : '');
            }
          }
        }
      }

      if (pendingTarget && gameState === 'playing' && gameMode === 'items') {
        const a = 0.10 + 0.06 * Math.sin((now - pendingTargetPulseT) / 160);
        ctx.fillStyle = 'rgba(13, 17, 23, 0.35)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            if (grid[y][x] !== 0) continue;
            if (isInCenterZone(x, y)) continue;
            if (isPickupCell(x, y)) continue;
            ctx.fillStyle = `rgba(255, 217, 61, ${a})`;
            ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
            ctx.strokeStyle = `rgba(255, 217, 61, ${0.40 + a})`;
            ctx.lineWidth = Math.max(1, CELL * 0.06);
            ctx.strokeRect(x * CELL + 2, y * CELL + 2, CELL - 4, CELL - 4);
          }
        }
        if (aimCell && aimCell.x >= 0 && aimCell.x < COLS && aimCell.y >= 0 && aimCell.y < ROWS) {
          const bx = aimCell.x * CELL;
          const by = aimCell.y * CELL;
          const ok = !!aimCell.valid;
          const c = ok ? 'rgba(255,217,61,1)' : 'rgba(255,107,107,1)';
          ctx.globalAlpha = 1;
          ctx.strokeStyle = c;
          ctx.lineWidth = Math.max(2, CELL * 0.12);
          ctx.strokeRect(bx + 2, by + 2, CELL - 4, CELL - 4);
          ctx.strokeStyle = c.replace(',1)', ',0.55)');
          ctx.lineWidth = Math.max(1, CELL * 0.06);
          ctx.beginPath();
          ctx.moveTo(bx + CELL / 2, by + 6);
          ctx.lineTo(bx + CELL / 2, by + CELL - 6);
          ctx.moveTo(bx + 6, by + CELL / 2);
          ctx.lineTo(bx + CELL - 6, by + CELL / 2);
          ctx.stroke();
        }
      }

      if (gameMode === 'items') {
        const pulse = 0.82 + 0.18 * Math.sin(now / 180);
        for (const p of worldPickups) {
          const meta = getItemById(p.itemTypeId);
          if (!meta) continue;
          const px = p.x * CELL + CELL / 2;
          const py = p.y * CELL + CELL / 2;
          const coldBombId = ITEM_TYPES.coldBomb ? ITEM_TYPES.coldBomb.id : 0;
          const defuseId = ITEM_TYPES.defuse ? ITEM_TYPES.defuse.id : 0;
          const magnetId = ITEM_TYPES.magnet ? ITEM_TYPES.magnet.id : 0;
          let color = 'rgba(255,217,61,1)';
          if (coldBombId && p.itemTypeId === coldBombId) color = 'rgba(255,107,107,1)';
          if (defuseId && p.itemTypeId === defuseId) color = 'rgba(100,255,218,1)';
          if (p.itemTypeId === ITEM_TYPES.laser.id) color = 'rgba(107,203,255,1)';
          if (magnetId && p.itemTypeId === magnetId) color = 'rgba(199,146,234,1)';
          ctx.globalAlpha = 1;
          ctx.shadowColor = color;
          ctx.shadowBlur = 22;
          ctx.fillStyle = color.replace(',1)', ',0.26)');
          ctx.beginPath();
          ctx.arc(px, py, Math.max(12, CELL * 0.32) * pulse, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = color.replace(',1)', ',0.95)');
          ctx.lineWidth = Math.max(2, CELL * 0.08);
          ctx.beginPath();
          ctx.arc(px, py, Math.max(14, CELL * 0.38) * pulse, 0, Math.PI * 2);
          ctx.stroke();
          ctx.shadowBlur = 0;
          ctx.fillStyle = 'rgba(13, 17, 23, 0.85)';
          ctx.beginPath();
          ctx.arc(px, py, Math.max(10, CELL * 0.22), 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = 'rgba(255,255,255,0.96)';
          ctx.font = `${Math.max(12, Math.floor(CELL * 0.42))}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(meta.label, px, py + 0.5);
        }
      }

      for (const f of flyItems) {
        const p = Math.min(1, f.t / f.maxT);
        const e = 1 - Math.pow(1 - p, 3);
        const x = f.sx + (f.ex - f.sx) * e;
        const y = f.sy + (f.ey - f.sy) * e;
        const a = 1 - p;
        ctx.globalAlpha = 0.95 * a;
        ctx.shadowColor = f.color;
        ctx.shadowBlur = 18;
        ctx.fillStyle = f.color.replace(',1)', ',0.85)');
        ctx.beginPath();
        ctx.arc(x, y, Math.max(6, CELL * 0.18), 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
        if (f.label) {
          ctx.globalAlpha = 1;
          ctx.fillStyle = 'rgba(13, 17, 23, 0.9)';
          ctx.font = `${Math.max(10, Math.floor(CELL * 0.42))}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(f.label, x, y + 0.5);
        }
      }
      ctx.globalAlpha = 1;

      // 当前方块 + 边缘预警高亮
      if (piece) {
        if (piece.isLitBomb) {
          const remainMs = Math.max(0, piece.bombEndsAt - now);
          const remain = Math.max(0, Math.ceil(remainMs / 1000));
          const label = remain > 0 ? `${remain}` : '💣';
          const danger = 1 - Math.min(1, remainMs / LIT_BOMB_MS);
          const flash = 0.45 + 0.55 * Math.sin(now / (110 - 70 * danger));
          const alpha = 0.70 + 0.30 * Math.max(0, flash);
          const bx = (piece.renderX === undefined ? piece.x : piece.renderX);
          const by = (piece.renderY === undefined ? piece.y : piece.renderY);
          const cxp = (bx + 0.5) * CELL;
          const cyp = (by + 0.5) * CELL;
          const ringP = 0.5 + 0.5 * Math.sin(now / 90);
          const ringR = CELL * (0.78 + 0.42 * ringP + 0.25 * danger);
          ctx.globalAlpha = 0.85;
          ctx.strokeStyle = `rgba(255, 107, 107, ${0.40 + 0.45 * danger})`;
          ctx.lineWidth = Math.max(2, CELL * 0.09);
          ctx.beginPath();
          ctx.arc(cxp, cyp, ringR, 0, Math.PI * 2);
          ctx.stroke();
          ctx.globalAlpha = 0.55;
          ctx.setLineDash([Math.max(6, CELL * 0.35), Math.max(5, CELL * 0.28)]);
          ctx.strokeStyle = `rgba(255, 107, 107, ${0.25 + 0.40 * danger})`;
          ctx.lineWidth = Math.max(1, CELL * 0.06);
          ctx.beginPath();
          ctx.arc(cxp, cyp, ringR + CELL * 0.35, 0, Math.PI * 2);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
          drawBlock(bx, by, '#ff6b6b', alpha, true, label);
        } else {
        // 判断是否贴着任何边缘/方块（用于视觉提示）
        const nearEdge = isNearEdge();
        const bx = (piece.renderX === undefined ? piece.x : piece.renderX);
        const by = (piece.renderY === undefined ? piece.y : piece.renderY);
        for (let i = 0; i < piece.shape.length; i++) {
          const [px, py] = piece.shape[i];
          const gx = piece.x + px, gy = piece.y + py;
          if (gx >= 0 && gx < COLS && gy >= 0 && gy < ROWS) {
            const item = (gameMode === 'items' && piece.itemTypeId && i === piece.itemIndex) ? getItemById(piece.itemTypeId) : null;
            drawBlock(bx + px, by + py, COLORS[piece.color], 1, nearEdge || !!item, item ? item.label : '');
          }
        }
        }
      }

      for (const ex of explosions) {
        const p = Math.min(1, ex.t / ex.maxT);
        const cxp = (ex.x + 0.5) * CELL;
        const cyp = (ex.y + 0.5) * CELL;
        const r = (CELL * 0.6) + p * (CELL * 3.0);
        const alpha = (1 - p) * 0.65;
        ctx.globalAlpha = alpha;
        ctx.strokeStyle = ex.isLit ? 'rgba(255,107,107,0.95)' : 'rgba(255,217,61,0.95)';
        ctx.lineWidth = Math.max(2, CELL * 0.08);
        ctx.beginPath();
        ctx.arc(cxp, cyp, r, 0, Math.PI * 2);
        ctx.stroke();
        ctx.globalAlpha = Math.min(0.18, alpha);
        ctx.fillStyle = ex.isLit ? 'rgba(255,107,107,0.55)' : 'rgba(255,217,61,0.55)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
      }

      for (const pt of particles) {
        const p = Math.min(1, pt.t / pt.life);
        const alpha = (1 - p) * 0.9;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = pt.color || 'rgba(255,255,255,0.9)';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.globalAlpha = 1;

      for (const lf of lineFlashes) {
        const p = Math.min(1, lf.t / lf.maxT);
        const alpha = (1 - p) * 0.55;
        ctx.globalAlpha = alpha;
        if (lf.kind === 'row') {
          const y = lf.index * CELL;
          const grd = ctx.createLinearGradient(0, y, 0, y + CELL);
          grd.addColorStop(0, 'rgba(0,0,0,0)');
          grd.addColorStop(0.5, lf.color.replace(',1)', ',0.95)'));
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grd;
          ctx.fillRect(0, y, canvas.width, CELL);
        } else {
          const x = lf.index * CELL;
          const grd = ctx.createLinearGradient(x, 0, x + CELL, 0);
          grd.addColorStop(0, 'rgba(0,0,0,0)');
          grd.addColorStop(0.5, lf.color.replace(',1)', ',0.95)'));
          grd.addColorStop(1, 'rgba(0,0,0,0)');
          ctx.fillStyle = grd;
          ctx.fillRect(x, 0, CELL, canvas.height);
        }
        ctx.globalAlpha = 1;
      }
      ctx.restore();
      if (screenFlash.maxT > 0) {
        const p = Math.min(1, screenFlash.t / screenFlash.maxT);
        ctx.globalAlpha = (1 - p);
        ctx.fillStyle = screenFlash.color;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.globalAlpha = 1;
      }
    }

    // 检查是否紧贴边/方块（当前倾斜方向的下一格）
    function isNearEdge() {
      if (!piece) return false;
      const hasX = Math.abs(tiltX) >= MIN_ANGLE;
      const hasY = Math.abs(tiltY) >= MIN_ANGLE;
      if (hasX) {
        const dx = tiltX < 0 ? -1 : 1;
        if (outOfBounds(piece.x + dx, piece.y, piece.shape) || overlapsGrid(piece.x + dx, piece.y, piece.shape)) return true;
      }
      if (hasY) {
        const dy = tiltY < 0 ? -1 : 1;
        if (outOfBounds(piece.x, piece.y + dy, piece.shape) || overlapsGrid(piece.x, piece.y + dy, piece.shape)) return true;
      }
      return false;
    }

    function drawBlock(x, y, color, alpha = 1, glow = false, label = '') {
      ctx.globalAlpha = alpha;
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
      }
      ctx.fillStyle = color;
      ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);
      // 高光
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, Math.max(3, (CELL - 2) / 4));
      if (label) {
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(13, 17, 23, 0.9)';
        ctx.font = `${Math.max(10, Math.floor(CELL * 0.42))}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, x * CELL + CELL / 2, y * CELL + CELL / 2);
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    function drawBlockScaled(x, y, color, scale = 1, alpha = 1, glow = false, label = '') {
      ctx.globalAlpha = alpha;
      if (glow) {
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
      }
      const cx = x * CELL + CELL / 2;
      const cy = y * CELL + CELL / 2;
      const s = (CELL - 2) * scale;
      const left = cx - s / 2;
      const top = cy - s / 2;
      ctx.fillStyle = color;
      ctx.fillRect(left, top, s, s);
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.fillRect(left, top, s, Math.max(3, s / 4));
      if (label) {
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.fillStyle = 'rgba(13, 17, 23, 0.9)';
        ctx.font = `${Math.max(10, Math.floor(CELL * 0.42))}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(label, cx, cy);
      }
      ctx.shadowBlur = 0;
      ctx.globalAlpha = 1;
    }

    // ============== 游戏结束 ==============
    function gameOver(reason = '') {
      if (gameState === 'dead') return;
      lastGameOverReason = reason || '';
      gameState = 'dead';
      if (lastGameOverReason.includes('斩杀线')) {
        triggerFlash('rgba(255,107,107,0.35)', 240);
        triggerShake(18, 220);
      }
      playSfx('gameOver');
      updateRestartVisibility();
      updateInfoVisibility();
      updatePauseVisibility();
      setPausedUI(false);
      pendingTarget = null;
      if (score > best) {
        best = score;
        localStorage.setItem('grav_best', best);
        document.getElementById('best').textContent = best;
      }
      updateItemBar();
      const po = document.getElementById('pauseOverlay');
      po.classList.add('hidden');
      const ov = document.getElementById('overlay');
      ov.classList.add('hidden');
      const d = document.getElementById('deadOverlay');
      const reasonEl = document.getElementById('deadReason');
      if (reasonEl) reasonEl.textContent = lastGameOverReason ? `原因：${lastGameOverReason}` : '';
      d.classList.remove('hidden');
      syncAudioState();
    }

    function showResultOverlay() {
      if (gameState !== 'dead') return;
      const ov = document.getElementById('overlay');
      const mult = DIFF_CONFIG[selectedDiff].scoreMult || 1.0;
      const parts = scoreParts || {};
      const reasonHtml = lastGameOverReason ? `<p class="subtitle">${lastGameOverReason}</p>` : '';
      ov.innerHTML = `
        <h1>结果</h1>
        <div id="finalScore">${score}</div>
        <p class="subtitle">最高分: ${best}</p>
        ${reasonHtml}
        <div class="mode-section">
          <label>得分组成 (倍率 x${mult})</label>
          <p class="subtitle" style="margin-bottom:10px;">
            消除: ${parts.clear || 0} · 放置: ${parts.placement || 0} · 均衡: ${parts.balance || 0}<br>
            道具获得: ${parts.itemCollect || 0} · 道具使用: ${parts.itemUse || 0}<br>
            消除总数: ${clears} · 最高充满: ${maxFill}% · 道具使用次数: ${itemUseCount}
          </p>
        </div>
        <button class="btn" id="closeResultBtn">关闭结果</button>
      `.trim();
      const closeBtn = ov.querySelector('#closeResultBtn');
      if (closeBtn) {
        closeBtn.addEventListener('click', () => {
          ov.classList.add('hidden');
          document.getElementById('deadOverlay').classList.remove('hidden');
        });
        closeBtn.addEventListener('touchend', e => {
          e.preventDefault();
          ov.classList.add('hidden');
          document.getElementById('deadOverlay').classList.remove('hidden');
        });
      }
      document.getElementById('deadOverlay').classList.add('hidden');
      ov.classList.remove('hidden');
    }

    window.addEventListener('load', init);
  </script>
</body>
</html>
