<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Variant 06: Neon Stack — 堆叠的发光方块层，霓虹像素风 -->
  <!-- 设计理念：多层半透明方块错位堆叠，每层不同霓虹色，最像素霓虹的方案 -->
  <defs>
    <linearGradient id="neon-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="neon-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B2FFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7B2FFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="neon-pink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00E5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FF00E5" stop-opacity="0.65"/>
    </linearGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Layer 1: 底层，大，淡青色 -->
  <rect x="18" y="52" width="48" height="20" rx="4" fill="url(#neon-cyan)"
        stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.4"
        transform="rotate(-3, 42, 62)"/>
  <!-- Layer 2: 中层，紫色 -->
  <rect x="28" y="36" width="42" height="18" rx="4" fill="url(#neon-purple)"
        stroke="#7B2FFF" stroke-width="1.5" stroke-opacity="0.5"
        transform="rotate(2, 49, 45)"/>
  <!-- Layer 3: 顶层，粉色，最亮 -->
  <rect x="36" y="22" width="36" height="16" rx="4" fill="url(#neon-pink)"
        stroke="#FF00E5" stroke-width="1.5" stroke-opacity="0.7"
        transform="rotate(-5, 54, 30)" filter="url(#glow6)"/>
  <!-- 散落像素点 —— 霓虹碎片 -->
  <g fill="#00F0FF" opacity="0.6">
    <rect x="70" y="56" width="4" height="4" rx="1"/>
    <rect x="76" y="60" width="3" height="3" rx="0.5" opacity="0.4"/>
    <rect x="14" y="44" width="3" height="3" rx="0.5" opacity="0.3"/>
  </g>
  <g fill="#FF00E5" opacity="0.5">
    <rect x="66" y="30" width="3" height="3" rx="0.5"/>
    <rect x="26" y="68" width="4" height="4" rx="1" opacity="0.3"/>
  </g>
</svg>
