<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Variant 05: Spiral Gravity — 方块沿螺旋轨迹向中心坍缩 -->
  <!-- 设计理念：螺旋 + 方块节点，模拟重力场吸引方块向心坠落 -->
  <defs>
    <linearGradient id="neon-g5" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#7B2FFF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
  </defs>
  <g fill="url(#neon-g5)">
    <!-- 螺旋轨道上的方块，外大内小，外淡内浓 -->
    <!-- 外层 -->
    <rect x="72" y="16" width="9" height="9" rx="2" opacity="0.25" transform="rotate(15, 76.5, 20.5)"/>
    <rect x="78" y="38" width="8" height="8" rx="2" opacity="0.3" transform="rotate(50, 82, 42)"/>
    <rect x="68" y="62" width="8" height="8" rx="2" opacity="0.4" transform="rotate(85, 72, 66)"/>
    <!-- 中层 -->
    <rect x="50" y="72" width="7" height="7" rx="1.5" opacity="0.55" transform="rotate(130, 53.5, 75.5)"/>
    <rect x="28" y="64" width="7" height="7" rx="1.5" opacity="0.65" transform="rotate(170, 31.5, 67.5)"/>
    <rect x="20" y="44" width="6" height="6" rx="1.5" opacity="0.7" transform="rotate(210, 23, 47)"/>
    <!-- 内层 -->
    <rect x="28" y="28" width="6" height="6" rx="1.5" opacity="0.8" transform="rotate(260, 31, 31)"/>
    <rect x="40" y="22" width="5" height="5" rx="1" opacity="0.85" transform="rotate(300, 42.5, 24.5)"/>
    <!-- 核心 —— 重力奇点 -->
    <circle cx="50" cy="48" r="5" opacity="1"/>
  </g>
</svg>
