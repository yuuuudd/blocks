<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Variant 01: Tilt Cube — 单个倾斜方块，极简几何 -->
  <!-- 设计理念：一个微微倾斜的方块暗示"重力/失衡"，极简到只有一个元素 -->
  <defs>
    <linearGradient id="neon-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#FF00E5"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-12, 50, 50)">
    <rect x="28" y="28" width="44" height="44" rx="6" ry="6"
          fill="none" stroke="url(#neon-g1)" stroke-width="4"/>
    <!-- 内部重心点 —— 暗示重力中心偏移 -->
    <circle cx="44" cy="58" r="5" fill="url(#neon-g1)" opacity="0.9"/>
  </g>
</svg>
